<!doctype html>
<!--
  bpsim viewer. `sim --trace ...` writes a copy of this page with the run file
  built in (viewer.html). Opened as is, it waits for a run.json to be dropped
  on it, which is the quick loop while working on the viewer.

  Layout, top to bottom: what is being read now; the run as a chart that is
  also the timeline (per pool, one bar per page for as long as it stayed in
  memory); under the chart of the pool in focus, that pool drawn in the shape
  of how it works; the database file as a strip; and the query's path and rows
  folded away.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bpsim viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600&family=Geist:wght@400;500&family=Geist+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#f6f5f2; --ink:#1c1b19; --ink-2:#55514a; --muted:#6b665e; --line:#0000001f; --soft:#0000000a;
  --accent:#9a3412; --hit:#2f6b3c; --miss:#a3461f; --mark:#f3d27a66;
  --o-schema:#7d7872; --free:#d9d5cd; --o0:#3f7d4d; --o1:#4b60c8; --o2:#b47a12; --o3:#8a4fb0; --o4:#17828a; --o5:#b8496a;
  --f-display:"Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
  --f-body:"Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#111112; --ink:#eceae6; --ink-2:#aca79f; --muted:#918c84; --line:#ffffff24; --soft:#ffffff0a;
  --accent:#ec8a63; --hit:#86c08f; --miss:#ec8a63; --mark:#e5c15b38;
  --o-schema:#9b968f; --free:#3a3835; --o0:#86c08f; --o1:#8c9cf2; --o2:#e5c15b; --o3:#c29be0; --o4:#5fc4cc; --o5:#ee8fab;
  color-scheme:dark;
}}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
[hidden]{display:none!important}
.app{position:relative;max-width:1040px;margin:0 auto;padding:28px 20px 44px;display:flex;flex-direction:column;gap:20px}
button,select{font-family:var(--f-body);font-size:12.5px;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:999px;height:32px;padding:0 12px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--ink-2)}
button:disabled{opacity:.35;cursor:default}
button:focus-visible,select:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.name{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.name h1{font-family:var(--f-display);font-weight:600;font-size:22px;letter-spacing:-.01em;margin:0}
.name span{font-size:12.5px;color:var(--muted)}
.ctrl{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;margin-right:6px}
.seg button{border:0;height:26px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
#play{background:var(--ink);color:var(--bg);border-color:var(--ink);min-width:88px}
.icon{width:32px;padding:0}
.warn{margin:0;padding:8px 12px;border:1px solid var(--miss);border-radius:8px;color:var(--miss);font-size:13px}

/* the run as a chart; also the timeline. One row per pool. */
.chart{display:flex;flex-direction:column;gap:6px;touch-action:pan-y}
.crow{display:grid;grid-template-columns:150px minmax(0,1fr) 104px;gap:6px 20px;align-items:center}
.cnote{font-size:11.5px;color:var(--muted)}
.ctrack{position:relative;cursor:ew-resize}
.axis{height:36px}
.axis .mk{position:absolute;top:0;width:10px;height:10px;padding:0;border:0;border-radius:2px;transform:translateX(-50%) rotate(45deg);background:var(--muted)}
.axis .mk.cur{background:var(--accent)}
.axis .qs{all:unset;cursor:pointer;position:absolute;top:16px;height:20px;border-top:3px solid var(--line);padding-top:3px;font-size:11.5px;font-variant-numeric:tabular-nums;line-height:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.axis .qs:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.axis .qs.done{border-top-color:var(--ink-2)}
.axis .qs.cur{color:var(--ink)}
.band .tint{position:absolute;top:0;bottom:0;border-radius:3px;background:color-mix(in srgb,var(--c) 10%,transparent)}
.band .qb{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.band .bar{position:absolute;min-width:1px;border-radius:2px;background:color-mix(in srgb,var(--c) 32%,var(--bg));border-left:1px solid var(--c);overflow:hidden;font-family:var(--f-mono);font-size:10px;color:var(--ink);white-space:nowrap}
.band .bar.lab{padding-left:3px}
.band .bar.edge{border-left-width:3px}
.band .bar i{position:absolute;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;background:color-mix(in srgb,var(--ink) 65%,var(--c))}
.band .veil{position:absolute;top:-1px;bottom:-1px;right:0;background:var(--bg);opacity:.66;pointer-events:none}
.band .ph{position:absolute;top:-3px;bottom:-3px;width:2px;margin-left:-1px;border-radius:1px;background:var(--ink);pointer-events:none}

.caption{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;min-height:22px}
.caption b{font-family:var(--f-display);font-weight:600;font-size:16px}
.caption code{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);overflow-wrap:anywhere}
.caption .pos{margin-left:auto;font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--muted)}
.moment{display:flex;align-items:baseline;gap:10px;font-size:13px;color:var(--ink-2);min-height:24px;flex-wrap:wrap}
.moment .tag{font-weight:500;font-size:12.5px;color:var(--accent)}
.moment .d{flex:1 1 300px;min-width:0}
.moment button{height:24px;font-size:11.5px;margin-left:auto;white-space:nowrap}

/* how to read the chart */
.keyrow{align-items:start;padding-top:6px}
.link{all:unset;cursor:pointer;font-size:12px;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;border-radius:3px}
.link:hover{color:var(--ink)}
.link:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.key{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:11.5px;color:var(--muted)}
.key span{display:inline-flex;align-items:center;gap:6px}
.key i{flex:none}
.key .kb{width:24px;height:9px;border-radius:2px;background:color-mix(in srgb,var(--ink-2) 30%,var(--bg));border-left:3px solid var(--ink-2)}
.key .kh{width:4px;height:4px;border-radius:50%;background:var(--ink)}
.key .kf{width:24px;height:9px;border-radius:2px;background:color-mix(in srgb,var(--ink-2) 12%,var(--bg))}
.key .ks{width:24px;height:9px;border-radius:2px;background:color-mix(in srgb,var(--o2) 22%,var(--bg))}
.key .km{width:8px;height:8px;border-radius:2px;transform:rotate(45deg);background:var(--muted)}
.help{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:8px 36px;border-top:1px solid var(--line);padding-top:14px;margin-top:6px;font-size:13px;color:var(--ink-2)}
.help p{margin:0}
.help b{font-weight:500;color:var(--ink)}
.help .foot{grid-column:1 / -1}

/* pools */
.pools{display:flex;flex-direction:column;gap:14px}
.pool.focus{padding:6px 0 10px}
.pname{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:1px;font-size:13.5px;color:var(--ink-2);border-radius:4px}
.pname small{font-size:11.5px;color:var(--muted)}
.pool.focus .pname span{font-family:var(--f-display);font-weight:600;font-size:17px;line-height:1.2;color:var(--ink)}
.pool:not(.focus) .pname small{display:none}
.pool:not(.focus) .pname:hover span{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.fig{grid-column:2 / 4;min-width:0;padding-top:10px}
.tiles{display:flex;flex-wrap:wrap;gap:6px}
.slot{position:relative;width:var(--ts);height:var(--ts);flex:none;border-radius:8px;background:var(--soft)}
.tile{position:relative;width:var(--ts);height:var(--ts);flex:none;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  background:color-mix(in srgb,var(--c) 15%,var(--bg));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 70%,transparent);transition:transform .16s ease}
.tile .pg{font-family:var(--f-mono);font-size:12px;line-height:1}
.tile .bd{font-family:var(--f-mono);font-size:10px;color:var(--muted);display:flex;gap:2px;line-height:1;min-height:4px}
.tile.old{background:transparent;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 80%,transparent)}
.tile.ring{box-shadow:inset 0 0 0 1.5px var(--accent)}
.tile.dirty::after{content:"";position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.tile.touched{box-shadow:inset 0 0 0 2px var(--ink)}
.tile.pulse{transform:scale(1.1)}
.fig.small .tile,.fig.small .slot{border-radius:4px}
.fig.small .tile .pg,.fig.small .tile .bd{display:none}
.fig.small .tile.dirty::after{top:2px;right:2px;width:4px;height:4px}
.dots{display:flex;gap:2px}.dots i{width:4px;height:4px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--ink-2)}
.axisline{display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--muted);margin-bottom:8px}
.axisline i{flex:1;height:1px;background:var(--line)}
.shape{display:flex;flex-wrap:wrap;gap:14px 28px;align-items:center}
.ringbox{position:relative;flex:none}
.ringbox .tile,.ringbox .slot{position:absolute}
.ringbox .hand{position:absolute;width:2px;background:var(--accent);transform-origin:50% 100%;border-radius:1px}
.ringbox .hub{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.keys{flex:1 1 220px;min-width:0;display:flex;flex-direction:column;gap:8px;font-size:12.5px;color:var(--ink-2)}
.keys div{display:flex;gap:10px;align-items:center}
.keys .g{flex:none;width:26px;display:flex;justify-content:center}
.split{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 14px}
.split .grp{display:flex;flex-direction:column;gap:8px;min-width:0}
.split .lbl{font-size:11.5px;color:var(--muted)}
.split .mid{flex:none;width:2px;height:var(--ts);background:var(--accent);border-radius:1px}
.hint{font-size:12.5px;color:var(--ink-2);margin-top:10px}
.handmark{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);border-left:4px solid transparent;border-right:4px solid transparent;border-bottom:6px solid var(--accent)}
.score{position:relative;text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;line-height:1.3}
.score .t{font-size:16px}
.score .s{font-family:var(--f-body);font-size:11.5px;color:var(--muted)}
.place{position:absolute;right:0;top:-16px;font-size:11px;padding:1px 8px;border-radius:999px;background:var(--ink);color:var(--bg);opacity:0;transition:opacity .2s}
.place.on{opacity:1}
.say{grid-column:2 / 4;font-size:12.5px;color:var(--ink-2);min-height:19px;line-height:19px}
.say .k{font-weight:500;margin-right:8px}
.say .k.hit{color:var(--hit)}.say .k.miss{color:var(--miss)}

/* database file */
.disk{display:flex;flex-direction:column;gap:6px}
.cells{display:grid;gap:1px}
.cells i{height:10px;border-radius:1px;background:color-mix(in srgb,var(--c) 30%,var(--bg))}
.cells.dense i{height:5px}
.cells i.int{background:color-mix(in srgb,var(--c) 75%,var(--bg))}
.cells i.now{outline:1.5px solid var(--accent);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;border-radius:2px;background:var(--c)}
.fly{position:absolute;z-index:5;left:0;top:0;width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:10px;
  background:color-mix(in srgb,var(--c) 25%,var(--bg));box-shadow:inset 0 0 0 1px var(--c);pointer-events:none}
.fly.wb{box-shadow:inset 0 0 0 1px var(--accent);background:var(--bg)}

/* the query's path and rows, folded */
details{border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;list-style:none;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);border-radius:4px}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸";color:var(--muted);font-size:11px}
details[open] summary::before{content:"▾"}
summary b{font-weight:500;color:var(--ink)}
.cols{display:flex;flex-wrap:wrap;gap:22px 40px;padding-top:16px;align-items:flex-start}
.col{min-width:0;display:flex;flex-direction:column;gap:10px}
.col.q{flex:1 1 220px}.col.p{flex:2.2 1 380px}.col.c{flex:1.1 1 220px}
.eyebrow{font-size:11.5px;color:var(--muted)}
.col.q h2{font-family:var(--f-display);font-weight:600;font-size:20px;line-height:1.2;margin:0}
.sql{font-family:var(--f-mono);font-size:12.5px;background:var(--soft);border-radius:8px;padding:8px 10px;white-space:pre-wrap;overflow-wrap:anywhere}
.plan{font-family:var(--f-mono);font-size:11px;color:var(--muted);overflow-wrap:anywhere}
.path{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.path button{font-family:var(--f-mono);height:22px;padding:0 7px;font-size:11px;border-color:color-mix(in srgb,var(--c) 60%,transparent);background:color-mix(in srgb,var(--c) 12%,transparent)}
.path button.now{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.path button.later{opacity:.55}
.pagehd{font-weight:500}
.pagehd span{font-weight:400;font-size:11.5px;font-variant-numeric:tabular-nums;color:var(--muted);padding-left:10px}
.rows{max-height:230px;overflow:auto}
.rows table{border-collapse:collapse;width:100%;font-family:var(--f-mono);font-size:11.5px;font-variant-numeric:tabular-nums}
.rows th,.rows td{padding:3px 14px 3px 6px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line)}
.rows th{position:sticky;top:0;background:var(--bg);color:var(--muted);font-weight:400}
.rows tr.mark td{background:var(--mark)}
.why{font-size:12.5px;color:var(--ink-2)}
.qcost{display:flex;flex-direction:column;gap:5px;padding:9px 0;border-top:1px solid var(--line)}
.qcost .l{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px}
.qcost .l span{font-size:11.5px;font-variant-numeric:tabular-nums;color:var(--muted)}
.ticks{display:flex;flex-wrap:wrap;gap:2px}
.ticks i{width:9px;height:9px;border-radius:2px;box-shadow:inset 0 0 0 1px var(--line)}
.ticks i.hit{background:var(--hit);box-shadow:none}.ticks i.miss{background:var(--miss);box-shadow:none}

footer{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-size:12px;color:var(--muted)}
.pt{height:26px;font-size:11.5px}
.pt[aria-pressed="true"]{border-color:var(--ink-2)}
.pt[aria-pressed="false"]{color:var(--muted)}
.foot{max-width:100ch;font-size:12px;color:var(--muted)}
#drop{max-width:520px;margin:18vh auto 0;padding:36px 24px;border:2px dashed var(--line);border-radius:12px;text-align:center;color:var(--ink-2)}
#error{max-width:520px;margin:24px auto;padding:0 20px;color:var(--miss)}
body.dragging #drop,body.dragging .app{outline:2px dashed var(--muted);outline-offset:6px}

@media (max-width:720px){
  .crow{grid-template-columns:minmax(0,1fr) auto}
  .crow .ctrack,.fig,.say,.keyrow .key{grid-column:1 / -1}
  .crow.axisrow .cnote{display:none}
  .crow.axisrow .ctrack{grid-row:1}
  .pool:not(.focus) .score{display:flex;gap:6px;align-items:baseline}
  .caption .pos{margin-left:0;width:100%}
}
@media (prefers-reduced-motion: reduce){.tile,.place{transition:none}}
</style>
</head>
<body>
<div id="drop" hidden>No run data in this page. Drop a <code>run.json</code> here.</div>
<p id="error" hidden></p>

<div class="app" id="app" hidden>
  <header class="top">
    <div class="name"><h1 id="title"></h1><span id="sub"></span></div>
    <div class="ctrl" role="group" aria-label="Playback">
      <div class="seg" role="group" aria-label="Mode">
        <button type="button" id="mStep" aria-pressed="true">Step</button>
        <button type="button" id="mRace" aria-pressed="false">Race</button>
      </div>
      <div class="seg" role="group" aria-label="Storage">
        <button type="button" id="sSsd" aria-pressed="true">SSD</button>
        <button type="button" id="sHdd" aria-pressed="false">HDD</button>
      </div>
      <button type="button" class="icon" id="prev" aria-label="Previous read">◀</button>
      <button type="button" id="play">Play</button>
      <button type="button" class="icon" id="next" aria-label="Next read">▶</button>
      <select id="speed" aria-label="Speed"><option value="1.8">0.5×</option><option value="1" selected>1×</option><option value="0.5">2×</option></select>
    </div>
  </header>
  <p class="warn" id="warn" hidden></p>

  <div class="caption"><b id="qTitle"></b><code id="qSql"></code><span class="pos" id="pos"></span></div>
  <div class="moment" id="moment" aria-live="polite"></div>

  <section class="chart" id="chart" aria-label="The run: per pool, one bar per page for as long as it stayed in memory">
    <div class="crow axisrow"><span class="cnote" id="chartNote"></span><div class="ctrack axis" id="axis"></div><span class="cnote" style="text-align:right">time · hits</span></div>
    <div class="pools" id="pools"></div>
    <div class="crow keyrow"><button type="button" class="link" id="helpBtn" aria-expanded="false" aria-controls="help">How to read this</button><div class="key" id="key"></div><span></span></div>
    <div class="help" id="help" hidden></div>
    <label class="sr" for="scrub">Page read</label><input class="sr" type="range" id="scrub" min="-1" value="-1">
  </section>

  <section class="disk" aria-label="Database file">
    <div class="cells" id="cells"></div>
    <div class="legend" id="legend"></div>
  </section>

  <details id="fold">
    <summary id="foldSum"></summary>
    <div class="cols" id="foldBody"></div>
  </details>

  <footer id="footer"></footer>
</div>

<script id="run" type="application/json">__BPSIM_RUN__</script>
<script>
"use strict";
const FORMAT = "bpsim-run", VERSION = 5;
const INFO = {
  fifo:   {name: "FIFO", how: "oldest load out", textbook: true},
  lru:    {name: "LRU", how: "least recent out"},
  clock:  {name: "Clock", how: "second chance", textbook: true},
  pg:     {name: "PostgreSQL-style", how: "usage counts + scan ring"},
  innodb: {name: "InnoDB-style", how: "midpoint insertion"},
  opt:    {name: "Optimal", how: "fewest misses, not always fastest"},
};
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const nameOf = p => p === "opt" && READS_AHEAD ? "Optimal (no read-ahead)" : INFO[p]?.name || p;
/* Time for one access under a storage profile, from what the engine recorded.
   A read request costs a fixed part plus one page. Where the page sits
   relative to the last page read sets the fixed part: the next page or a few
   pages further on cost the near overhead plus the skipped pages passing
   under the head (never more than a jump); a jump costs a full request. A
   page SQLite wrote without reading costs nothing to read. A dirty eviction
   adds a write request. Every profile prices the same events. */
function readMs(e, P) {
  if (e.kind === "hit") return P.hit_ms;
  const near = n => Math.min(P.near_request_ms + n * P.page_ms, P.read_request_ms) + P.page_ms;
  const extra = (e.ahead?.length || 0) * P.page_ms; // pages read ahead ride in the same request
  return extra + (e.read === "next" ? near(0) : e.read === "ahead" ? near(e.skipped) : e.read === "jump" ? P.read_request_ms + P.page_ms : 0);
}
const writeMs = P => P.write_request_ms + P.page_ms;
const writeBacks = e => (e.evicted?.dirty ? 1 : 0) + (e.ahead_evicted || []).filter(v => v.dirty).length;
const msOf = (e, P) => readMs(e, P) + writeBacks(e) * writeMs(P);
const costOf = e => msOf(e, PROFILE);
function fmtMs(ms) {
  if (ms < 1) { const us = ms * 1000; return `${us < 10 ? us.toFixed(1) : us.toFixed(0)} µs`; }
  if (ms < 1000) return `${ms < 10 ? ms.toFixed(2) : ms.toFixed(1)} ms`;
  return `${(ms / 1000).toFixed(2)} s`;
}

/* everything about the loaded run; replaced when a run.json is dropped */
let D, RUN, EV0, K, N, PAGE, OBJ, BARS, CUM, KIND, LANES, POS, MOMENTS = [], STORAGE, PROFILE, READS_AHEAD = false;
let visible = [], focus = null, mode = "step", k = -1, playing = false, raceId = 0;
const speed = () => +$("speed").value;
const sleep = ms => new Promise(r => setTimeout(r, ms * speed()));

const colorOf = page => PAGE[page] && PAGE[page].object == null ? "var(--free)" : OBJ[PAGE[page]?.object] || "var(--o-schema)";
const objLabel = o => o === "sqlite_schema" ? "schema" : (o || "free");
const pageDesc = page => !PAGE[page] ? (page === 1 ? "header" : "not described") : PAGE[page].object == null ? "free page" : `${objLabel(PAGE[page].object)} ${kindLabel(page)}`;
const kindLabel = page => page === 1 ? "header" : PAGE[page]?.kind === "internal" ? "interior" : (PAGE[page]?.kind || "page");
const isScanQ = q => EV0.slice(q.accesses[0], q.accesses[1]).some(e => e.scan);

function start(data) {
  if (data.format !== FORMAT || data.version !== VERSION) throw new Error(`expected ${FORMAT} v${VERSION}, got ${data.format} v${data.version}`);
  if (!data.runs?.length || !data.runs[0].events.length) throw new Error("the run file has no events");
  stopRace(); playing = false;
  D = data; N = D.frames; EV0 = D.runs[0].events; K = EV0.length;
  RUN = {}; BARS = {}; KIND = {}; LANES = {}; POS = {};
  for (const r of D.runs) {
    RUN[r.policy] = r; BARS[r.policy] = residency(r.events);
    KIND[r.policy] = r.events[0].frames[r.events[0].frame].state.kind;
  }
  READS_AHEAD = D.runs.some(r => r.summary.read_ahead_cap > 0);
  setStorage(D.storage, false);
  PAGE = {}; for (const p of D.pages) PAGE[p.page] = p;
  OBJ = {sqlite_schema: "var(--o-schema)"};
  D.objects.forEach((o, i) => { OBJ[o.name] = `var(--o${i % 6})`; });

  const all = D.runs.map(r => r.policy), real = all.filter(p => !INFO[p]?.textbook);
  visible = real.length ? real : all;
  focus = ["pg", "innodb"].find(p => visible.includes(p)) || visible[0];
  mode = "step"; k = -1;

  $("drop").hidden = true; $("error").hidden = true; $("app").hidden = false;
  $("title").textContent = `${D.scenario}.db`;
  const cap = Math.max(...D.runs.map(r => r.summary.read_ahead_cap));
  $("sub").textContent = `${D.queries.length} quer${D.queries.length === 1 ? "y" : "ies"} · ${K} page accesses · ${N} frame${N === 1 ? "" : "s"} · ` +
    (cap ? `read-ahead up to ${cap} page${cap > 1 ? "s" : ""}` : "no read-ahead");
  $("scrub").max = K - 1;
  const bad = D.runs.filter(r => !addsUp(r)).map(r => nameOf(r.policy));
  $("warn").hidden = !bad.length;
  $("warn").textContent = bad.length ? `This run file does not add up for ${bad.join(", ")}: its events and its summary disagree, so the numbers below may be wrong.` : "";

  buildDisk(); buildFooter(); buildHelp(); buildLanes();
  setModeUI();
  jump(MOMENTS.length && MOMENTS[0].k > 0 ? MOMENTS[0].k - 1 : -1);
}

/* each event list must recount to its own summary, priced as the summary was */
function addsUp(run) {
  const P = D.profiles[run.summary.storage];
  let hits = 0, next = 0, ahead = 0, jump = 0, fresh = 0, dirty = 0, ms = 0, early = 0, earlyHits = 0;
  for (const e of run.events) {
    if (e.kind === "hit") hits++; else if (e.read === "next") next++; else if (e.read === "ahead") ahead++; else if (e.read === "jump") jump++; else fresh++;
    dirty += writeBacks(e); ms += msOf(e, P); early += e.ahead?.length || 0; if (e.read_ahead_hit) earlyHits++;
  }
  const s = run.summary;
  return P && hits === s.hits && next === s.next_page_reads && ahead === s.ahead_reads && jump === s.jump_reads && fresh === s.fresh_pages && dirty === s.dirty_evictions &&
    early === s.pages_read_ahead && earlyHits === s.read_ahead_hits && next + ahead + jump === s.read_requests &&
    Math.abs(ms - s.total_ms) < 1e-9 * Math.max(1, s.total_ms);
}

/* switching storage reprices the same events; nothing cached changes */
function setStorage(kind, redraw = true) {
  if (!D.profiles[kind]) return;
  STORAGE = kind; PROFILE = D.profiles[kind]; CUM = {};
  for (const r of D.runs) {
    let ms = 0, hits = 0, early = 0, req = 0; const c = [], h = [], a = [], q = [];
    for (const e of r.events) {
      ms += costOf(e); if (e.kind === "hit") hits++; if (e.read_ahead_hit) early++; if (e.read) req++;
      c.push(ms); h.push(hits); a.push(early); q.push(req);
    }
    CUM[r.policy] = {c, h, a, q};
  }
  $("sSsd").setAttribute("aria-pressed", kind === "ssd"); $("sHdd").setAttribute("aria-pressed", kind === "hdd");
  if (redraw) { buildHelp(); buildMoments(); renderAll(k); }
}

/* one bar per (frame, page): the reads it stayed for, and its hits */
function residency(evs) {
  const bars = [], open = new Array(N).fill(null);
  for (let i = 0; i < K; i++) {
    const fr = evs[i].frames;
    for (let f = 0; f < N; f++) {
      const pg = fr[f].page, o = open[f];
      if (o && o.page !== pg) { o.e = i - 1; bars.push(o); open[f] = null; }
      if (pg != null && !open[f]) open[f] = {f, page: pg, s: i, e: i, hits: []};
    }
    if (evs[i].kind === "hit" && open[evs[i].frame]) open[evs[i].frame].hits.push(i);
  }
  for (const o of open) if (o) { o.e = K - 1; bars.push(o); }
  return bars;
}

/* ---------- database file strip, footer ---------- */
let cellEls = {};
function buildDisk() {
  const cells = $("cells"); cells.replaceChildren(); cellEls = {};
  const cols = Math.min(D.page_count, D.page_count > 400 ? 100 : 80);
  cells.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;
  cells.classList.toggle("dense", D.page_count > 4 * cols);
  for (let p = 1; p <= D.page_count; p++) {
    const c = el("i"); c.style.setProperty("--c", colorOf(p));
    if (PAGE[p]?.kind === "internal" || p === 1) c.className = "int";
    c.title = `page ${p} · ${pageDesc(p)}`;
    cells.append(c); cellEls[p] = c;
  }
  const legend = $("legend"); legend.replaceChildren(el("span", "", `${D.scenario}.db on disk, ${D.page_count} pages`));
  for (const o of ["sqlite_schema", ...D.objects.map(o => o.name)]) {
    const s = el("span"); const sw = el("i"); s.style.setProperty("--c", OBJ[o]); s.append(sw, objLabel(o)); legend.append(s);
  }
  if (D.pages.some(p => p.object == null)) {
    const s = el("span"); const sw = el("i"); s.style.setProperty("--c", "var(--free)"); s.append(sw, "free (on the freelist)"); legend.append(s);
  }
  const m = el("span"); const dot = el("i"); dot.style.cssText = "background:var(--accent);border-radius:50%"; m.append(dot, "modified in memory"); legend.append(m);
}
function buildFooter() {
  const f = $("footer"); f.replaceChildren(el("span", "", "pools"));
  for (const r of D.runs) {
    const p = r.policy, b = el("button", "pt", nameOf(p)); b.type = "button"; b.dataset.p = p;
    b.addEventListener("click", () => {
      visible = visible.includes(p) ? visible.filter(x => x !== p) : D.runs.map(r => r.policy).filter(x => x === p || visible.includes(x));
      if (!visible.length) visible = [p];

}
function buildHelp() {
  const key = $("key"); key.replaceChildren();
  const item = (cls, text) => { const sp = el("span"); sp.append(el("i", cls), text); key.append(sp); };
  item("kb", "a page held in memory; the dark edge is its disk read");
  item("kh", "a hit");
  item("kf", "not read yet");
  if (D.queries.some(isScanQ)) item("ks", "a scan");
  item("km", "a moment worth a look");

  const help = $("help"); help.replaceChildren();
  const tip = (lead, text) => { const p = el("p"); p.append(el("b", "", lead + " "), text); help.append(p); };
  tip("Rows.", `Each row is one buffer pool serving the same ${K} page accesses with ${N} frame${N === 1 ? "" : "s"} of memory. They differ only in what they evict.`);
  tip("Bars.", "A bar is one page staying in one frame. Long bars mean the pool kept the page. Many short bars mean it keeps throwing pages out.");
  tip("Moving.", "Drag on the chart, or use the left and right arrow keys, to move through the accesses. Click a query number or a diamond to jump.");
  tip("Opening a pool.", "Click a pool's name to open it and see how it decides what to evict. One pool is open at a time.");
  const P = PROFILE, label = STORAGE === "hdd" ? "a hard drive" : "an SSD";
  tip("Time.", STORAGE === "hdd"
    ? `Rough time on a hard drive: ${fmtMs(P.hit_ms)} for a hit. A read after a jump (backwards, or the first) is a seek and half a turn of the platter: ${fmtMs(P.read_request_ms + P.page_ms)}. Reading further on is cheap, since the head is already moving that way: ${fmtMs(P.near_request_ms + P.page_ms)} for the next page plus ${fmtMs(P.page_ms)} for each page skipped (${fmtMs(P.near_request_ms)} of that is an assumed overhead). Writing a modified page back is a separate ${fmtMs(writeMs(P))}. Switch SSD and HDD at the top; what is cached stays the same.`
    : `Rough time on an SSD: ${fmtMs(P.hit_ms)} for a hit, ${fmtMs(P.read_request_ms + P.page_ms)} for any read, wherever the page is (there is no head to move; some drives prefetch the next pages themselves, which is left out), and ${fmtMs(writeMs(P))} to write a modified page back (the drive's cache takes it). So on an SSD, layout only matters once pages are read in fewer, larger requests. Switch SSD and HDD at the top; what is cached stays the same.`);
  tip("Race.", "Replays every pool at the pace of its time, on a squashed scale so hits stay visible next to slow reads. Optimal has the fewest misses, but not always the least time: it ignores what a miss costs.");
  if (READS_AHEAD) tip("Read-ahead.", "When a miss continues a table or index (its previous access was the page before), the pool also reads the next few pages of that table in the same request, up to a quarter of the pool. PostgreSQL-style reads ahead for scans instead, and only as far as its scan ring allows. Read-ahead pages enter cold: Clock leaves their bit clear, InnoDB-style puts them at the head of old and starts their clock at first use. Hits on them show as \"read ahead\". Requests count how often a query waited on the disk. Optimal never reads ahead, so others can beat its misses.");
  const mini = [];
  if (RUN.pg) mini.push("the PostgreSQL-style scan ring is a quarter of the pool (real: 32 pages)");
  if (RUN.innodb) mini.push("InnoDB-style promotes a page on a hit in a later query (real: after 1 second)");
  help.append(el("p", "foot", `Page reads were captured from SQLite ${D.sqlite_version} and replayed through miniature policies` + (mini.length ? `: ${mini.join("; ")}` : "") +
    ". Every pool sees SQLite's reads; another database would read different pages for the same query. Times come from one datasheet per drive (a Samsung 990 Pro SSD, a 7,200 rpm enterprise hard drive); the operating system's file cache and overlapping I/O with work are left out. The layout is SQLite's: tables share one file page by page." +
    (READS_AHEAD ? " Read-ahead here is a simple rule (two pages of a table in a row; scans for PostgreSQL-style); real InnoDB reads a whole 64-page extent once 56 of its pages were read in order, and would not read ahead tables this small at all." : "")));
}

/* ---------- chart + pools for the visible set ---------- */
function buildLanes() {
  stopRace();
  for (const b of $("footer").querySelectorAll(".pt")) b.setAttribute("aria-pressed", visible.includes(b.dataset.p));
  const pools = $("pools"); pools.replaceChildren(); LANES = {};
  for (const p of D.runs.map(r => r.policy).filter(p => visible.includes(p))) {
    const lane = el("section", "pool crow"); lane.setAttribute("aria-label", nameOf(p));
    const pn = el("button", "pname"); pn.type = "button"; pn.append(el("span", "", nameOf(p)), el("small", "", INFO[p]?.how || ""));
    pn.addEventListener("click", () => setFocus(p));
    const track = el("div", "ctrack band"), score = el("div", "score"), fig = el("div", "fig"), sayEl = el("div", "say");
    score.append(el("span", "place"), el("div", "t", "0"), el("div", "s"));
    lane.append(pn, track, score, fig, sayEl); pools.append(lane);
    LANES[p] = {lane, pn, track, score, fig, sayEl};
    if (POS[p] === undefined) POS[p] = k;
  }
  markFocus(); buildMoments(); buildChart();
}
function markFocus() {
  for (const p of visible) { const L = LANES[p], on = p === focus; L.lane.classList.toggle("focus", on); L.pn.setAttribute("aria-expanded", on); L.fig.hidden = !on; }
}
function setFocus(p) { if (p === focus) return; focus = p; markFocus(); buildChart(); for (const q of visible) paintLane(q, POS[q]); }

function buildChart() {
  const axis = $("axis"); axis.replaceChildren();
  const W = axis.clientWidth || 600;
  $("chartNote").textContent = `${N} frame${N === 1 ? "" : "s"} × ${K} accesses`;
  const seen = new Set();
  for (const m of MOMENTS) {
    if (seen.has(m.k)) continue; seen.add(m.k);
    const b = el("button", "mk"); b.type = "button"; b.dataset.k = m.k; b.style.left = `${100 * (m.k + .5) / K}%`;
    b.title = MOMENTS.filter(x => x.k === m.k).map(x => x.t).join(" · "); b.setAttribute("aria-label", "Moment: " + b.title);
    b.addEventListener("click", () => { toStep(); jump(m.k); }); axis.append(b);
  }
  D.queries.forEach((q, i) => {
    const [a, b] = q.accesses, px = W * (b - a) / K;
    const s = el("button", "qs"); s.type = "button"; s.dataset.q = i;
    s.style.left = `${100 * a / K}%`; s.style.width = `calc(${100 * (b - a) / K}% - 3px)`;
    s.textContent = px >= 150 ? `${i + 1} · ${q.title}${isScanQ(q) ? " (scan)" : ""}` : px >= 8 * String(i + 1).length + 6 ? i + 1 : "";
    s.title = `Query ${i + 1}: ${q.title}`; s.setAttribute("aria-label", s.title);
    s.addEventListener("click", () => { toStep(); jump(a); }); axis.append(s);
  });

  const colW = W / K;
  for (const p of visible) {
    // the pool in focus gets rows tall enough to label; the others stay slim
    const H = p === focus ? Math.max(30, Math.min(120, N * 15)) : Math.max(24, Math.min(56, N * 6)), rowH = H / N, gap = rowH >= 8 ? 2 : rowH >= 3 ? 1 : 0;
    const tr = LANES[p].track; tr.replaceChildren(); tr.style.height = H + "px";
    D.queries.forEach(q => {
      const [a, b] = q.accesses, scan = EV0.slice(a, b).find(e => e.scan);
      if (scan) { const t = el("span", "tint"); t.style.left = `${100 * a / K}%`; t.style.width = `${100 * (b - a) / K}%`; t.style.setProperty("--c", colorOf(scan.page)); tr.append(t); }
      if (a && colW >= 2) { const l = el("span", "qb"); l.style.left = `${100 * a / K}%`; tr.append(l); }
    });
    for (const bar of BARS[p]) {
      const span = bar.e - bar.s + 1, d = el("div", "bar" + (colW >= 5 ? " edge" : ""));
      d.style.cssText = `left:${100 * bar.s / K}%;width:calc(${100 * span / K}% - ${colW >= 3 ? 1 : 0}px);top:${bar.f * rowH}px;height:${Math.max(1, rowH - gap)}px;line-height:${Math.max(1, rowH - gap)}px`;
      d.style.setProperty("--c", colorOf(bar.page));
      if (rowH - gap >= 12 && span * colW >= 30) { d.textContent = "p" + bar.page; d.classList.add("lab"); }
      if (rowH - gap >= 7 && colW >= 7) for (const h of bar.hits) { const dot = el("i"); dot.style.left = `${100 * (h - bar.s + .5) / span}%`; d.append(dot); }

}
function markAxis(at) {
  const q = at >= 0 ? EV0[at].query : -1;
  for (const s of $("axis").querySelectorAll(".qs")) { const i = +s.dataset.q; s.classList.toggle("cur", i === q); s.classList.toggle("done", q >= 0 && D.queries[i].accesses[0] <= at); }
  for (const b of $("axis").querySelectorAll(".mk")) b.classList.toggle("cur", mode === "step" && +b.dataset.k === at);
}
const totals = (p, at) => at < 0 ? {cost: 0, hits: 0, early: 0, req: 0} : {cost: CUM[p].c[at], hits: CUM[p].h[at], early: CUM[p].a[at], req: CUM[p].q[at]};
function paintBand(p, at) {
  const L = LANES[p], x = `${100 * (at + 1) / K}%`;
  L.track.querySelector(".veil").style.left = x;
  const ph = L.track.querySelector(".ph"); ph.style.left = x; ph.hidden = at < 0;

/* ---------- one access in words ---------- */
function describe(p, e) {
  const ev = e.evicted, parts = [], sweeps = e.notes.filter(n => n.kind === "swept").length;
  if (e.read === "next") parts.push("reads the next page on disk");
  else if (e.read === "ahead") parts.push(`reads ${e.skipped + 1} page${e.skipped ? "s" : ""} further on`);
  else if (e.read === "jump") parts.push("jumps on disk: a full request");
  else if (e.kind === "miss") parts.push("a page SQLite writes without reading: nothing to read from disk");
  if (e.ahead?.length) parts.push(`reads ${e.ahead.length > 1 ? `p${e.ahead[0]}–p${e.ahead.at(-1)}` : `p${e.ahead[0]}`} ahead in the same request`);
  if (e.read_ahead_hit) parts.push("read ahead earlier: no wait");
  /* evict notes come in order: the missed page's victim (if any), then the read-ahead's */
  const victims = [ev, ...(e.ahead_evicted || [])].filter(Boolean); let vi = 0;
  for (const n of e.notes) {
    if (n.kind === "evict") {
      const vic = victims[vi++] || {page: "?", dirty: false}, early = vic !== ev;
      const w = n.why, v = `p${vic.page}`;
      if (early) parts.push("for the read-ahead");
      if (sweeps) parts.push(`hand passes ${sweeps} frame${sweeps > 1 ? "s" : ""}`);
      parts.push(
        w.kind === "least_recent" ? `evicts ${v}, used least recently` :
        w.kind === "loaded_first" ? `evicts ${v}, loaded first` :
        w.kind === "count_zero" ? `evicts ${v}, ${p === "clock" ? "its bit was clear" : "its usage was 0"}` :
        w.kind === "ring_reuse" ? `the scan reuses its ring frame, evicting ${v}` :
        w.kind === "old_tail" ? `evicts ${v} from the old tail` :
        w.kind === "furthest_next_use" ? (w.next_use == null ? `evicts ${v}, never needed again` : `evicts ${v}, needed last (read ${w.next_use + 1})`) : `evicts ${v}`);
      if (vic.dirty) parts.push(`${v} was modified: written back first`);
    }
    else if (n.kind === "counted" && e.kind === "hit") parts.push(p === "clock" ? "bit set" : `usage ${n.from} → ${n.to}`);
    else if (n.kind === "joined_ring") parts.push("frame joins the scan's ring");
    else if (n.kind === "ring_busy") parts.push(`ring frame is hot (usage ${n.usage}), sweeps instead`);
    else if (n.kind === "inserted") parts.push("enters at the midpoint (old)");
    else if (n.kind === "promoted") parts.push("seen again in a later query: promoted to young");
    else if (n.kind === "stays_old") parts.push("seen again in the same query: stays old");
    else if (n.kind === "first_use") parts.push("first use of a page read ahead: stays old, its clock starts now");
  }
  if (e.kind === "hit" && p === "lru") parts.push("now most recent");
  if (e.kind === "hit" && p === "innodb" && !e.notes.length) parts.push("moves to the head");
  if (e.kind === "hit" && p === "pg" && e.scan && !e.notes.length) parts.push("a scan's hit leaves usage as is");
  if (e.kind === "hit" && !parts.length) parts.push("already in memory");
  if (e.kind === "miss" && !ev) parts.push("into an empty frame");
  /* a request that reads ahead repeats a step per page: say it once with a count */
  const merged = [];
  for (const t of parts) { const last = merged.at(-1); if (last && last.t === t) last.n++; else merged.push({t, n: 1}); }
  return merged.map(m => m.n > 1 ? `${m.t} (×${m.n})` : m.t).join(" · ");
}

/* ---------- drawing pools ---------- */
function pips(n) { const d = el("span", "dots"); for (let i = 0; i < 5; i++) d.append(el("i", i < n ? "on" : "")); return d; }
function tile(f, at, touched, badge) {
  if (f.page == null) return el("div", "slot");
  const st = f.state, t = el("div", "tile" + (f.dirty ? " dirty" : "") + (st.kind === "innodb" && st.region === "old" ? " old" : "") + (st.kind === "pg" && st.in_ring ? " ring" : "") + (touched ? " touched" : ""));
  t.dataset.page = f.page; t.style.setProperty("--c", colorOf(f.page)); t.title = `page ${f.page} · ${pageDesc(f.page)}`;
  t.append(el("span", "pg", "p" + f.page));
  const b = el("span", "bd");
  if (st.kind === "pg") b.append(pips(st.usage));
  else if (st.kind === "clock") b.textContent = st.referenced ? "●" : "";
  else if (badge === "next" && st.rank === 0) b.textContent = "next";
  else if (st.kind === "opt" && badge) b.textContent = st.next_use == null ? "never" : `in ${st.next_use - at}`;
  t.append(b); return t;
}
function axisLine(a, b) { const d = el("div", "axisline"); d.append(el("span", "", a), el("i"), el("span", "", b)); return d; }
function row(frames, at, hit, badge) { const d = el("div", "tiles"); frames.forEach(f => d.append(tile(f, at, f === hit, badge))); return d; }

function drawFocus(p, e, at, touched) {
  const out = el("div"), fr = e.frames, hit = touched >= 0 ? fr[touched] : null, kind = KIND[p];
  const live = fr.filter(f => f.page != null), empty = fr.filter(f => f.page == null);
  const ts = N <= 10 ? 56 : N <= 16 ? 46 : N <= 32 ? 36 : 20;
  const ringOk = (kind === "pg" || kind === "clock") && N >= 3 && N <= 16;
  const fig = LANES[p].fig; fig.style.setProperty("--ts", (ringOk ? 44 : ts) + "px"); fig.classList.toggle("small", !ringOk && ts < 30);

  if (kind === "lru" || kind === "fifo") {
    out.append(axisLine(kind === "lru" ? "used most recently" : "loaded last", "next out"),
      row([...live].sort((a, b) => b.state.rank - a.state.rank).concat(empty), at, hit));
  } else if (kind === "opt") {
    const key = f => f.state.next_use == null ? Infinity : f.state.next_use;
    out.append(axisLine("needed soonest", "needed last: next out"), row([...live].sort((a, b) => key(a) - key(b)).concat(empty), at, hit, true));
  } else if (kind === "innodb") {
    const by = r => live.filter(f => f.state.region === r).sort((a, b) => b.state.rank - a.state.rank);
    const young = by("young"), old = by("old"), s = el("div", "split");
    const grp = (label, fs) => { const g = el("div", "grp"); g.append(el("span", "lbl", label), row(fs, at, hit)); return g; };
    if (young.length) s.append(grp(`young · ${young.length}, protected`, young));
    s.append(el("span", "mid"), grp(`old · ${old.length}, on probation${empty.length ? ` · ${empty.length} empty` : ""}`, old.concat(empty)), el("span", "lbl", "next out"));
    out.append(s, el("div", "hint", "New pages enter at the bar. Only a hit in a later query moves one into young."));
  } else if (ringOk) {
    const r = Math.max(58, N * 44 * 1.2 / (2 * Math.PI)), box = 2 * r + 44, ring = el("div", "ringbox"); ring.style.width = ring.style.height = box + "px";
    fr.forEach((f, i) => {
      const a = i * 2 * Math.PI / N, t = tile(f, at, f === hit);
      t.style.left = `${box / 2 + r * Math.sin(a) - 22}px`; t.style.top = `${box / 2 - r * Math.cos(a) - 22}px`; ring.append(t);
    });
    if (e.hand != null) {
      const len = r - 30, h = el("span", "hand"); h.style.cssText = `left:${box / 2 - 1}px;top:${box / 2 - len}px;height:${len}px;transform:rotate(${e.hand * 360 / N}deg)`;
      const hub = el("span", "hub"); hub.style.cssText = `left:${box / 2 - 4}px;top:${box / 2 - 4}px`; ring.append(h, hub);
    }
    const keys = el("div", "keys"), key = (glyph, text) => { const d = el("div"), g = el("span", "g"); g.append(glyph); d.append(g, el("span", "", text)); keys.append(d); };
    const hand = el("span"); hand.style.cssText = "width:2px;height:16px;background:var(--accent)";
    key(hand, kind === "pg" ? "Hand: sweeps clockwise, taking one from each count until it finds a 0." : "Hand: sweeps clockwise, clearing bits until it finds a clear one.");
    if (kind === "pg") {
      key(pips(3), "Usage count, 0 to 5. A hit adds one.");
      const rg = el("span"); rg.style.cssText = "width:14px;height:14px;border-radius:4px;box-shadow:inset 0 0 0 1.5px var(--accent)";
      key(rg, "Scan ring: the only frames a big scan may recycle.");
    } else key(el("span", "", "●"), "Reference bit: set on every use, buys one more lap.");
    const s = el("div", "shape"); s.append(ring, keys); out.append(s);
  } else {
    const d = row(fr, at, hit, "next");
    if (e.hand != null && d.children[e.hand] && ts >= 30) d.children[e.hand].append(el("span", "handmark"));
    out.append(d);
  }
  return out;
}
function paintLane(p, at) {
  const L = LANES[p]; if (!L) return; POS[p] = at;
  const e = at >= 0 ? RUN[p].events[at] : null, touched = e && mode === "step" ? e.frame : -1;
  const shown = e || {frames: Array.from({length: N}, () => ({page: null, dirty: false, state: {kind: "empty"}})), hand: null};
  if (p === focus) L.fig.replaceChildren(drawFocus(p, shown, at, touched)); else L.fig.replaceChildren();
  const t = totals(p, at);
  L.score.querySelector(".t").textContent = at < 0 ? "0" : fmtMs(t.cost);
  const left = at === K - 1 ? RUN[p].summary.dirty_at_end : 0;
  L.score.querySelector(".s").textContent = at < 0 ? "nothing yet" :
    `${t.hits}/${at + 1} hits · ${t.req} request${t.req === 1 ? "" : "s"}` + (left ? ` · ${left} still modified` : "");
  L.score.title = at < 0 ? "" : [
    `${t.hits} hits, ${t.early} of them on pages read ahead; ${t.req} disk request${t.req === 1 ? "" : "s"} waited on`,
    left ? `${left} modified page${left > 1 ? "s" : ""} still in memory at the end; a checkpoint would write ${left > 1 ? "them" : "it"} (not counted)` : ""].filter(Boolean).join(". ");
  L.sayEl.replaceChildren();
  if (e && mode === "step") L.sayEl.append(el("span", "k " + e.kind, e.kind), describe(p, e));
  paintBand(p, at);
}
function renderAll(at) { for (const p of visible) paintLane(p, at); renderChrome(at); }
function renderChrome(at) {
  for (const c of Object.values(cellEls)) c.classList.remove("now");
  if (at >= 0 && mode === "step") cellEls[EV0[at].page]?.classList.add("now");
  $("scrub").value = at; markAxis(at);
  const q = at >= 0 ? EV0[at].query : -1, query = D.queries[Math.max(0, q)];
  if (mode === "race") { $("qTitle").textContent = "Race"; $("qSql").textContent = ""; $("pos").textContent = `${K} accesses each`; }
  else {
    $("qTitle").textContent = q < 0 ? "Before the first query" : `${q + 1}. ${query.title}`;
    $("qSql").textContent = q < 0 ? "" : query.sql;
    $("pos").textContent = at < 0 ? `${K} accesses ahead` : `access ${at + 1}/${K} · p${EV0[at].page} ${pageDesc(EV0[at].page)}`;
  }
  renderMoment(at); renderFold(at);
}

/* ---------- moments, found from the events ---------- */
function buildMoments() {
  const list = [], real = visible.filter(p => p !== "opt"), E = p => RUN[p].events;
  const and = xs => xs.length > 1 ? xs.slice(0, -1).join(", ") + " and " + xs.at(-1) : xs[0];
  D.queries.forEach(q => {
    const s = EV0.slice(q.accesses[0], q.accesses[1]).find(e => e.scan);
    if (s) list.push({k: s.pos, t: "A scan starts", d: `${q.title} reads all ${s.scan} pages of ${objLabel(PAGE[s.page]?.object)}. Watch what each pool keeps.`});
  });
  if (real.length > 1) for (let i = 0; i < K; i++) {
    const acts = real.map(p => { const e = E(p)[i]; return e.kind === "hit" ? "keeps it" : e.evicted ? "evicts p" + e.evicted.page : "uses a free frame"; });
    if (new Set(acts).size > 1) { list.push({k: i, t: "The pools disagree", d: real.map((p, j) => `${nameOf(p)} ${acts[j]}`).join(" · ")}); break; }
  }
  const ra = real.map(p => [p, E(p).findIndex(e => e.ahead?.length)]).filter(([, i]) => i >= 0).sort((x, y) => x[1] - y[1])[0];
  if (ra) {
    const [p, i] = ra, e = E(p)[i], n = e.ahead.length;
    list.push({k: i, t: "Reading ahead", d: `${nameOf(p)} reads p${e.page} and the ${n > 1 ? `next ${n} pages` : "next page"} of ${objLabel(PAGE[e.page]?.object)} in one request; when the query gets to them they are already in memory.`});
  }
  if (RUN.opt) {
    const regrets = {};
    for (const p of real) {
      const ev = E(p), last = {};
      for (let i = 0; i < K; i++) {
        const e = ev[i];
        if (e.kind === "miss" && last[e.page] !== undefined && RUN.opt.events[i].kind === "hit") { (regrets[i] ||= {k: i, page: e.page, who: []}).who.push(nameOf(p)); break; }
        if (e.evicted) last[e.evicted.page] = i;
      }
    }
    for (const r of Object.values(regrets)) list.push({k: r.k, t: "Paying for an eviction", d: `${and(r.who)} evicted p${r.page} earlier and must now read it back from disk. Optimal kept it.`});
  }
  for (const p of real) {
    const i = E(p).findIndex(e => e.evicted?.dirty);
    if (i >= 0) { list.push({k: i, t: "A modified page goes back to disk", d: `${nameOf(p)} writes p${E(p)[i].evicted.page} back before reusing the frame, so this access takes ${fmtMs(writeMs(PROFILE))} longer.`}); break; }
  }
  if (real.length > 1) {
    let best = null;
    D.queries.forEach((q, i) => {
      const h = real.map(p => E(p).slice(q.accesses[0], q.accesses[1]).filter(e => e.kind === "hit").length), gap = Math.max(...h) - Math.min(...h);
      if (gap > 0 && (!best || gap > best.gap)) best = {gap, i, h};
    });
    if (best) { const q = D.queries[best.i], n = q.accesses[1] - q.accesses[0]; list.push({k: q.accesses[0], t: "Same query, different hits", d: real.map((p, j) => `${nameOf(p)} ${best.h[j]}/${n} hits`).join(" · ")}); }
  }
  MOMENTS = list.sort((a, b) => a.k - b.k);
}
function renderMoment(at) {
  const box = $("moment"); box.replaceChildren();
  if (mode === "race") { box.append(el("span", "d", "Each pool runs at its own pace: hits are quick, disk reads take visible time, write-backs longer.")); return; }
  const here = MOMENTS.filter(m => m.k === at), next = MOMENTS.find(m => m.k > at);
  if (here.length) box.append(el("span", "tag", "◆ " + here.map(m => m.t).join(" · ")), el("span", "d", here.map(m => m.d).join(" ")));
  else box.append(el("span", "d", at < 0 && next ? "Press Play, or jump to the first moment." : ""));
  if (next) { const b = el("button", "", `next: ${next.t.toLowerCase()} →`); b.type = "button"; b.addEventListener("click", () => { stop(); jump(next.k); }); box.append(b); }
}

/* ---------- the query's path, rows and cost ---------- */
function renderFold(at) {
  const sum = $("foldSum"), body = $("foldBody"); sum.replaceChildren(); body.replaceChildren();
  if (at < 0 || mode === "race") { sum.append(el("b", "", "Query path and rows"), "shown while stepping"); return; }
  const e = EV0[at], q = D.queries[e.query], rows = D.rows[e.page], [a, b] = q.accesses;
  sum.append(el("b", "", "Query path and rows"), `p${e.page} · ${pageDesc(e.page)}` + (rows ? ` · ${rows.rows.length} entries` : ""));
  if (!$("fold").open) return;

  const cq = el("div", "col q");
  cq.append(el("span", "eyebrow", `the query · ${e.query + 1} of ${D.queries.length}`), el("h2", "", q.title), el("div", "sql", q.sql));
  if (q.plan.length) cq.append(el("div", "plan", "plan: " + q.plan.join(" · ")));
  cq.append(el("div", "why", `${b - a} page read${b - a === 1 ? "" : "s"}.`));

  const cp = el("div", "col p"), path = el("div", "path");
  const lo = Math.max(a, Math.min(at - 6, b - 14)), hi = Math.min(b, Math.max(lo + 14, at + 2));
  if (lo > a) path.append("…");
  for (let i = lo; i < hi; i++) {
    const x = el("button", i === at ? "now" : i > at ? "later" : "", "p" + EV0[i].page); x.type = "button"; x.style.setProperty("--c", colorOf(EV0[i].page));
    x.title = `read ${i + 1}: ${pageDesc(EV0[i].page)}`; x.addEventListener("click", () => { stop(); jump(i); });
    path.append(x); if (i < hi - 1) path.append("→");
  }
  if (hi < b) path.append("…");
  const hd = el("div", "pagehd", pageDesc(e.page)); if (rows) hd.append(el("span", "", `${rows.rows.length} entries on p${e.page}`));
  cp.append(el("span", "eyebrow", "the pages it reads"), path, hd);
  if (!rows) cp.append(el("div", "why", e.page === 1 ? "Page 1 holds the file header and schema. SQLite reads it at the start of every statement." : "No rows were captured for this page."));
  else {
    const ci = c => rows.columns.indexOf(c), next = at + 1 < b ? EV0[at + 1].page : null;
    const w = q.sql.split(/\bWHERE\b/i)[1], lits = w ? [...w.matchAll(/(\w+)\s*=\s*(?:'([^']*)'|(\d+(?:\.\d+)?))/g)].map(m => ({col: m[1], val: m[2] ?? m[3]})) : [];
    let reason = "";
    const marked = rows.rows.map(r => {
      if (ci("child_page") >= 0) { if (next != null && r[ci("child_page")] === next) { reason = `Highlighted: the entry SQLite follows down to p${next}.`; return true; } return false; }
      const hitLits = lits.filter(l => ci(l.col) >= 0 && String(r[ci(l.col)]) === l.val);
      if (hitLits.length) { reason = `Highlighted: ${hitLits.map(l => `${l.col} = ${l.val}`).join(", ")}.`; return true; }
      return false;
    });
    if (!reason && e.scan) reason = "The scan reads every entry on this page.";
    const wrap = el("div", "rows"), table = el("table"), head = el("tr"); rows.columns.forEach(c => head.append(el("th", "", c))); table.append(head);
    let first = null;
    rows.rows.forEach((r, i) => { const tr = el("tr", marked[i] ? "mark" : ""); if (marked[i]) first ||= tr; r.forEach(v => tr.append(el("td", "", v ?? "–"))); table.append(tr); });
    wrap.append(table); cp.append(wrap); if (reason) cp.append(el("div", "why", reason));
    if (first) requestAnimationFrame(() => { wrap.scrollTop = Math.max(0, first.offsetTop - 60); });
  }

  const cc = el("div", "col c"); cc.append(el("span", "eyebrow", "this query in each pool, so far"));
  const list = el("div");
  for (const p of visible) {
    const evs = RUN[p].events, row = el("div", "qcost"), l = el("div", "l"), ticks = el("div", "ticks");
    let cost = 0, hits = 0;
    for (let i = a; i < b; i++) { const done = i <= at; if (done) { cost += costOf(evs[i]); if (evs[i].kind === "hit") hits++; } ticks.append(el("i", done ? evs[i].kind : "")); }
    l.append(nameOf(p), el("span", "", `${hits}/${at - a + 1} hits · ${fmtMs(cost)}`)); row.append(l, ticks); list.append(row);
  }
  cc.append(list);
  body.append(cq, cp, cc);
}

/* ---------- motion ---------- */
function centerIn(node) { const a = node.getBoundingClientRect(), b = $("app").getBoundingClientRect(); return {x: a.left - b.left + a.width / 2, y: a.top - b.top + a.height / 2}; }
async function fly(from, to, label, c, wb, ms) {
  if (reduce || !from || !to) return;
  const t = el("div", "fly" + (wb ? " wb" : ""), label); t.style.setProperty("--c", c); $("app").append(t);
  const A = centerIn(from), B = centerIn(to);
  const a = t.animate([{transform: `translate(${A.x - 14}px,${A.y - 14}px) scale(.7)`, opacity: .2},
    {transform: `translate(${(A.x + B.x) / 2 - 14}px,${Math.min(A.y, B.y) - 26}px)`, opacity: 1, offset: .5},
    {transform: `translate(${B.x - 14}px,${B.y - 14}px)`, opacity: 1}], {duration: ms * speed(), easing: "cubic-bezier(.3,.7,.3,1)"});
  await a.finished.catch(() => {}); t.remove();
}
const tileOf = (p, page) => LANES[p]?.fig.querySelector(`[data-page="${page}"]`);
/* `id` is the epoch the step belongs to; a jump or a newer step makes it stale */
async function animateStep(p, at, id) {
  const e = RUN[p].events[at]; if (!LANES[p]) return;
  if (e.kind === "hit") { paintLane(p, at); const t = tileOf(p, e.page); if (!reduce) { t?.classList.add("pulse"); await sleep(130); t?.classList.remove("pulse"); } return; }
  if (reduce) { paintLane(p, at); return; }
  if (e.evicted?.dirty) { const from = tileOf(p, e.evicted.page); if (from) await fly(from, cellEls[e.evicted.page], "p" + e.evicted.page, colorOf(e.evicted.page), true, 360); else await sleep(360); }
  if (id !== raceId || !LANES[p]) return;
  paintLane(p, at);
  const t = tileOf(p, e.page);
  if (t) { t.style.visibility = "hidden"; await fly(cellEls[e.page], t, "p" + e.page, colorOf(e.page), false, 400); t.style.visibility = ""; } else await sleep(400);
}

/* ---------- controls ---------- */
function setModeUI() {
  $("mStep").setAttribute("aria-pressed", mode === "step"); $("mRace").setAttribute("aria-pressed", mode === "race");
  $("prev").disabled = $("next").disabled = mode === "race";
  $("play").textContent = mode === "race" ? "Race" : "Play";
}
function clearPlaces() { for (const p of visible) LANES[p]?.score.querySelector(".place").classList.remove("on"); }
function setMode(m) { if (m === mode) return; stopRace(); stop(); mode = m; if (m === "race") k = -1; setModeUI(); clearPlaces(); renderAll(k); }
function toStep() { if (mode !== "step") setMode("step"); stop(); }
function jump(i) { stopRace(); k = Math.max(-1, Math.min(K - 1, i)); clearPlaces(); renderAll(k); }
async function stepForward() {
  if (k >= K - 1) return false;
  for (const p of visible) if (POS[p] !== k) paintLane(p, k);
  k++; const at = k, id = ++raceId; document.querySelectorAll(".fly").forEach(f => f.remove());
  renderChrome(at); await Promise.all(visible.map(p => animateStep(p, at, id))); return id === raceId;
}
function stop() { playing = false; if (mode === "step") $("play").textContent = "Play"; }
async function play() {
  playing = true; $("play").textContent = "Pause"; if (k >= K - 1) jump(-1);
  while (playing && await stepForward()) await sleep(MOMENTS.some(m => m.k === k) ? 1400 : 280);
  stop();
}
function stopRace() { raceId++; if (mode === "race") { playing = false; $("play").textContent = "Race"; } document.querySelectorAll(".fly").forEach(f => f.remove()); }
async function race() {
  stopRace(); const id = raceId; playing = true; $("play").textContent = "Stop"; k = -1; clearPlaces(); renderAll(-1); let place = 0;
  await Promise.all(visible.map(async p => {
    for (let i = 0; i < K; i++) { if (id !== raceId) return; await animateStep(p, i, id); if (id !== raceId) return; await sleep(30 + 60 * Math.log10(1 + costOf(RUN[p].events[i]) / PROFILE.hit_ms)); }
    if (id !== raceId) return; place++;
    const pl = LANES[p].score.querySelector(".place"); pl.textContent = ["1st", "2nd", "3rd"][place - 1] || place + "th"; pl.classList.add("on");
  }));
  if (id === raceId) { playing = false; $("play").textContent = "Race again"; }
}
$("play").addEventListener("click", () => mode === "race" ? (playing ? stopRace() : race()) : (playing ? stop() : play()));
$("mStep").addEventListener("click", () => setMode("step"));
$("sSsd").addEventListener("click", () => { stopRace(); setStorage("ssd"); });
$("sHdd").addEventListener("click", () => { stopRace(); setStorage("hdd"); });
$("mRace").addEventListener("click", () => setMode("race"));
$("prev").addEventListener("click", () => { stop(); jump(k - 1); });
$("next").addEventListener("click", () => { stop(); stepForward(); });
$("scrub").addEventListener("input", () => { toStep(); jump(+$("scrub").value); });
$("fold").addEventListener("toggle", () => { if (D) renderFold(k); });
$("helpBtn").addEventListener("click", () => { const open = $("help").hidden; $("help").hidden = !open; $("helpBtn").setAttribute("aria-expanded", open); });
document.addEventListener("keydown", e => {
  if (!D || mode !== "step" || e.target.closest("input,select,summary")) return;
  if (e.key === "ArrowRight") { e.preventDefault(); stop(); stepForward(); }
  if (e.key === "ArrowLeft") { e.preventDefault(); stop(); jump(k - 1); }
});

/* drag on the chart to move through the run */
let dragging = null;
const scrubTo = ev => { const r = dragging.getBoundingClientRect(); jump(Math.floor((ev.clientX - r.left) / r.width * K)); };
$("chart").addEventListener("pointerdown", ev => {
  const tr = ev.target.closest(".ctrack"); if (!tr || ev.target.closest("button") || ev.button) return;
  toStep(); dragging = tr; tr.setPointerCapture(ev.pointerId); scrubTo(ev);
});
$("chart").addEventListener("pointermove", ev => { if (dragging) scrubTo(ev); });
for (const type of ["pointerup", "pointercancel"]) $("chart").addEventListener(type, () => { dragging = null; });
let resizeTimer = 0;
addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { if (D) buildChart(); }, 150); });

/* ---------- loading ---------- */
function fail(err) { const p = $("error"); p.textContent = `Could not show this run: ${err.message}`; p.hidden = false; }
function load(text) { try { start(JSON.parse(text)); } catch (err) { fail(err); } }
const embedded = $("run").textContent.trim();
if (embedded === "__BPSIM" + "_RUN__") $("drop").hidden = false; else load(embedded);
document.addEventListener("dragover", e => { e.preventDefault(); document.body.classList.add("dragging"); });
document.addEventListener("dragleave", () => document.body.classList.remove("dragging"));
document.addEventListener("drop", async e => {
  e.preventDefault(); document.body.classList.remove("dragging");
  const file = e.dataTransfer.files[0]; if (file) load(await file.text());
});
</script>
</body>
