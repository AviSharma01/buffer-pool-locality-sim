<!doctype html>
<!--
  bpsim viewer. `sim --trace ...` writes a copy of this page with the run file
  built in (viewer.html). Opened as is, it waits for a run.json to be dropped
  on it, which is the quick loop while working on the viewer.

  Layout: a score column (every pool; click one to open it) beside what just
  happened and the open pool, drawn in the shape of how it works; then the
  database file with the read head; then the timeline, one cell per page
  request; then the query's path and rows, folded away. Where each part goes
  is set in one place: the grid areas under "layout".
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bpsim viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600&family=Geist:wght@400;500&family=Geist+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#f6f5f2; --ink:#1c1b19; --ink-2:#55514a; --muted:#6b665e; --line:#0000001f; --soft:#0000000a;
  --accent:#9a3412; --hit:#2f6b3c; --miss:#a3461f; --mark:#f3d27a66;
  --o-schema:#7d7872; --free:#d9d5cd; --o0:#3f7d4d; --o1:#4b60c8; --o2:#b47a12; --o3:#8a4fb0; --o4:#17828a; --o5:#b8496a;
  --panel:color-mix(in srgb,var(--ink) 4.5%,var(--bg)); --raised:color-mix(in srgb,var(--bg) 70%,#fff);
  --f-display:"Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
  --f-body:"Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#111112; --ink:#eceae6; --ink-2:#aca79f; --muted:#918c84; --line:#ffffff24; --soft:#ffffff0a;
  --accent:#ec8a63; --hit:#86c08f; --miss:#ec8a63; --mark:#e5c15b38;
  --raised:color-mix(in srgb,var(--ink) 9%,var(--bg));
  --o-schema:#9b968f; --free:#3a3835; --o0:#86c08f; --o1:#8c9cf2; --o2:#e5c15b; --o3:#c29be0; --o4:#5fc4cc; --o5:#ee8fab;
  color-scheme:dark;
}}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
[hidden]{display:none!important}
.app{position:relative;max-width:1040px;margin:0 auto;padding:28px 20px 44px;display:flex;flex-direction:column;gap:20px}
button,select{font-family:var(--f-body);font-size:12.5px;color:var(--ink);background:var(--panel);border:0;border-radius:999px;height:32px;padding:0 13px;cursor:pointer}
button:hover:not(:disabled){background:color-mix(in srgb,var(--ink) 9%,var(--bg))}
button:disabled{opacity:.35;cursor:default}
button:focus-visible,select:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.name{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.name h1{font-family:var(--f-display);font-weight:600;font-size:22px;letter-spacing:-.01em;margin:0}
.name span{font-size:12.5px;color:var(--muted)}
.ctrl{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--panel);border-radius:999px;padding:3px;margin-right:6px}
.seg button{background:transparent;height:26px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
#play{background:var(--ink);color:var(--bg);border-color:var(--ink);min-width:88px}
#allBtn[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.icon{width:32px;padding:0}
.warn{margin:0;padding:10px 14px;background:color-mix(in srgb,var(--miss) 10%,var(--bg));border-radius:12px;color:var(--miss);font-size:13px}

/* header tools, the walkthrough dialog */
.tools{display:flex;align-items:center;gap:8px}
.hint{font-size:12px;color:var(--accent)}
dialog{border:0;border-radius:22px;padding:20px 24px 24px;width:min(660px,calc(100vw - 32px));max-height:86vh;overflow:auto;background:var(--bg);color:var(--ink);box-shadow:0 24px 70px rgba(0,0,0,.28)}
dialog::backdrop{background:rgba(24,22,19,.45)}
.dhead{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.dhead h2{font-family:var(--f-display);font-weight:600;font-size:20px;margin:0;flex:1}
.dsub{margin:0 0 14px;font-size:12.5px;color:var(--muted)}
#walk{display:flex;flex-direction:column;gap:6px;background:var(--panel);border-radius:18px;padding:16px 18px}
#walk .fig{padding:8px 0 4px}
#walk .said{font-size:18px}
.walknav{display:flex;align-items:center;gap:8px;margin-top:8px}
.walknav .dots{display:flex;gap:5px}
.walknav .dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.walknav .dots i.on{background:var(--accent)}
.walknav .tally{flex:1;font-size:12px;color:var(--muted);text-align:right;margin-right:6px}
.dh{font-family:var(--f-display);font-weight:600;font-size:16px;margin:22px 0 0}

/* layout: every part's place is set here, and only here */
.grid{display:grid;grid-template-columns:minmax(0,236px) minmax(0,1fr);grid-template-rows:auto 1fr;gap:16px;align-items:start;
  grid-template-areas:"score now" "score pool" "disk disk" "time time" "fold fold"}
#score{grid-area:score}#now{grid-area:now}#pools{grid-area:pool}#disk{grid-area:disk}#tl{grid-area:time}#fold{grid-area:fold}
.panel{background:var(--panel);border-radius:18px;padding:16px 18px;min-width:0}
.phead{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;font-size:12px;color:var(--muted)}
.phead .r{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums}

/* score column: one row per pool; the open pool's row is raised */
.slist{display:flex;flex-direction:column;gap:2px}
.srow{position:relative;display:flex;align-items:center;border-radius:12px}
.srow:hover{background:color-mix(in srgb,var(--ink) 5%,transparent)}
.srow.on{background:var(--raised)}
.sopen{all:unset;box-sizing:border-box;flex:1;min-width:0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1px 10px;padding:8px 4px 8px 10px;border-radius:12px;cursor:pointer}
.sopen:focus-visible,.sdraw:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
/* draw beside the open pool: a ring when off, a filled dot when on */
.sdraw{all:unset;flex:none;width:18px;height:18px;margin:0 9px 0 6px;border-radius:50%;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--ink) 30%,transparent);cursor:pointer;display:flex;align-items:center;justify-content:center}
.sdraw:hover{box-shadow:inset 0 0 0 1.5px var(--ink-2)}
.sdraw[aria-pressed="true"]{background:var(--ink);box-shadow:none}
.sdraw[aria-pressed="true"]::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--bg)}
.srow.on .sdraw{background:var(--accent);cursor:default}
/* outrank the page-wide button:hover background */
.srow .sopen:hover{background:transparent}
.srow .sdraw[aria-pressed="true"]:hover{background:var(--ink)}
.srow.on .sdraw[aria-pressed="true"]:hover{background:var(--accent)}
.srow .n{font-size:13.5px;color:var(--ink-2);min-width:0}
.srow.on .n{color:var(--ink);font-weight:500}
.srow .h{font-family:var(--f-mono);font-size:13.5px;font-variant-numeric:tabular-nums;text-align:right}
.srow .d{grid-column:1 / -1;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.place{position:absolute;right:8px;top:-7px;font-size:10.5px;padding:0 7px;border-radius:999px;background:var(--ink);color:var(--bg);opacity:0;transition:opacity .2s}
.place.on{opacity:1}
.snote{font-size:11.5px;color:var(--muted);margin:10px 10px 0}

/* what just happened: on the page itself, no panel */
#now{display:flex;flex-direction:column;gap:6px;padding:4px 4px 0;min-width:0}
.caption{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;font-size:12.5px;color:var(--muted)}
.caption b{font-family:var(--f-display);font-weight:600;font-size:15px;color:var(--ink-2)}
.caption code{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);overflow-wrap:anywhere}
.said{font-size:20px;line-height:1.35;letter-spacing:-.005em;min-height:27px}
.said .k{font-weight:500}.said .k.hit{color:var(--hit)}.said .k.miss{color:var(--miss)}
.said code{font-family:var(--f-mono);font-size:17px}
.why2{font-size:13px;color:var(--ink-2);min-height:20px}
.moment{display:flex;align-items:baseline;gap:10px;font-size:13px;color:var(--ink-2);min-height:26px;flex-wrap:wrap}
.moment .tag{font-weight:500;font-size:12.5px;color:var(--accent)}
.moment .d{flex:1 1 300px;min-width:0}
.moment button{height:26px;font-size:11.5px;margin-left:auto;white-space:nowrap}

/* timeline: one cell per page request, for the open pool */
.tlwrap{position:relative;touch-action:pan-y;cursor:ew-resize;user-select:none}
.tlmarks{position:relative;height:20px}
.tlmarks .mk{all:unset;cursor:pointer;position:absolute;bottom:4px;display:flex;align-items:center;gap:5px;transform:translateX(-5px);font-size:11px;color:var(--o2);white-space:nowrap}
.tlmarks .mk i{width:8px;height:8px;border-radius:2px;transform:rotate(45deg);background:var(--o2);flex:none}
.tlmarks .mk.left{transform:translateX(calc(-100% + 5px));flex-direction:row-reverse}
.tlmarks .mk.cur{color:var(--accent)}.tlmarks .mk.cur i{background:var(--accent)}
.tlmarks .mk:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#tlCanvas{display:block;width:100%;height:28px}
.tlhere{position:absolute;top:16px;bottom:16px;width:2px;margin-left:-1px;border-radius:1px;background:var(--ink);pointer-events:none}
.tlnames{position:relative;height:18px;margin-top:4px}
.tlnames .qs{all:unset;cursor:pointer;position:absolute;top:0;font-size:11px;line-height:16px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tlnames .qs.cur{color:var(--ink)}
.tlnames .qs:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* how to read the chart */
.keyrow{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;margin-top:12px}
.link{all:unset;cursor:pointer;font-size:12px;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;border-radius:3px}
.link:hover{color:var(--ink)}
.link:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.key{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:11.5px;color:var(--muted)}
.key span{display:inline-flex;align-items:center;gap:6px}
.key i{flex:none}
.key .kh,.key .ka,.key .kx{width:10px;height:10px;border-radius:3px}
.key .kh{background:color-mix(in srgb,var(--hit) 75%,var(--bg))}
.key .ka{box-shadow:inset 0 0 0 1.5px var(--hit);background:color-mix(in srgb,var(--hit) 30%,var(--bg))}
.key .kx{background:color-mix(in srgb,var(--miss) 38%,var(--bg))}
.key .km{width:8px;height:8px;border-radius:2px;transform:rotate(45deg);background:var(--o2)}
.help{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:8px 36px;padding-top:14px;margin-top:4px;font-size:13px;color:var(--ink-2)}
.help p{margin:0}
.help b{font-weight:500;color:var(--ink)}
.help .foot{grid-column:1 / -1}

/* pools */
#pools{display:flex;flex-direction:column;gap:18px}
.pool{min-width:0}
.pname{all:unset;cursor:pointer;display:flex;align-items:baseline;gap:10px;font-size:13.5px;color:var(--ink-2);border-radius:4px}
.pname small{font-size:11.5px;color:var(--muted)}
.pool.focus .pname{cursor:default}
.pool.focus .pname span{font-family:var(--f-display);font-weight:600;font-size:17px;line-height:1.2;color:var(--ink)}
.pool:not(.focus) .pname:hover span{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.fig{min-width:0;padding-top:12px}
.tiles{display:flex;flex-wrap:wrap;gap:6px}
.slot{position:relative;width:var(--ts);height:var(--ts);flex:none;border-radius:10px;background:color-mix(in srgb,var(--ink) 4%,transparent)}
.tile{position:relative;width:var(--ts);height:var(--ts);flex:none;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  background:color-mix(in srgb,var(--c) 16%,var(--bg));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 45%,transparent);transition:transform .16s ease}
.tile .pg{font-family:var(--f-mono);font-size:12px;line-height:1}
.tile .bd{font-family:var(--f-mono);font-size:10px;color:var(--muted);display:flex;gap:2px;line-height:1;min-height:4px}
.tile.old{background:transparent;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 80%,transparent)}
.tile.ring{box-shadow:inset 0 0 0 1.5px var(--accent)}
.tile.dirty::after{content:"";position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.tile.touched{box-shadow:inset 0 0 0 2px var(--ink)}
.tile{transition:transform .16s ease,box-shadow .25s ease}
.tile.pulse{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 45%,transparent),0 0 0 4px color-mix(in srgb,var(--hit) 30%,transparent)}
.tile.arrive{animation:arrive .32s ease-out}
@keyframes arrive{from{opacity:.2;transform:scale(.86)}}
.fig.small .tile,.fig.small .slot{border-radius:4px}
.fig.small .tile .pg,.fig.small .tile .bd{display:none}
.fig.small .tile.dirty::after{top:2px;right:2px;width:4px;height:4px}
.dots{display:flex;gap:2px}.dots i{width:4px;height:4px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--ink-2)}
.axisline{display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--muted);margin-bottom:8px}
.axisline i{flex:1;height:1px;background:var(--line)}
.shape{display:flex;flex-wrap:wrap;gap:14px 28px;align-items:center}
.ringbox{position:relative;flex:none}
.ringbox .tile,.ringbox .slot{position:absolute}
.ringbox .hand{position:absolute;width:2px;background:var(--accent);transform-origin:50% 100%;border-radius:1px}
.ringbox .hub{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.keys{flex:1 1 220px;min-width:0;display:flex;flex-direction:column;gap:8px;font-size:12.5px;color:var(--ink-2)}
.keys div{display:flex;gap:10px;align-items:center}
.keys .g{flex:none;width:26px;display:flex;justify-content:center}
.split{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 14px}
.split .grp{display:flex;flex-direction:column;gap:8px;min-width:0}
.split .lbl{font-size:11.5px;color:var(--muted)}
.split .mid{flex:none;width:2px;height:var(--ts);background:var(--accent);border-radius:1px}
.hint{font-size:12.5px;color:var(--ink-2);margin-top:10px}
.handmark{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);border-left:4px solid transparent;border-right:4px solid transparent;border-bottom:6px solid var(--accent)}
.say{font-size:12.5px;color:var(--ink-2);min-height:19px;line-height:19px;margin-top:8px}
.say .k{font-weight:500;margin-right:8px}
.say .k.hit{color:var(--hit)}.say .k.miss{color:var(--miss)}

/* database file */
.cells{display:grid;gap:7px 2px;padding-bottom:4px}
.cells i{position:relative;height:12px;border-radius:3px;background:color-mix(in srgb,var(--c) 30%,var(--bg))}
.cells.dense{row-gap:6px}.cells.dense i{height:6px;border-radius:2px}
.cells i.int{background:color-mix(in srgb,var(--c) 75%,var(--bg))}
.cells i.ra{box-shadow:0 0 0 1.5px color-mix(in srgb,var(--accent) 55%,transparent)}
.cells i.now{box-shadow:0 0 0 2px var(--accent)}
.cells i.head::after{content:"";position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);border-left:4px solid transparent;border-right:4px solid transparent;border-bottom:5px solid var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:10px;font-size:11.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;border-radius:2px;background:var(--c)}
.fly{position:absolute;z-index:5;left:0;top:0;width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:10px;
  background:color-mix(in srgb,var(--c) 25%,var(--bg));box-shadow:inset 0 0 0 1px var(--c);pointer-events:none}
.fly.wb{box-shadow:inset 0 0 0 1px var(--accent);background:var(--bg)}

/* the query's path and rows, folded */
details{padding:4px 4px 0}
summary{cursor:pointer;list-style:none;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);border-radius:4px}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸";color:var(--muted);font-size:11px}
details[open] summary::before{content:"▾"}
summary b{font-weight:500;color:var(--ink)}
.cols{display:flex;flex-wrap:wrap;gap:22px 40px;padding-top:16px;align-items:flex-start}
.col{min-width:0;display:flex;flex-direction:column;gap:10px}
.col.q{flex:1 1 220px}.col.p{flex:2.2 1 380px}.col.c{flex:1.1 1 220px}
.eyebrow{font-size:11.5px;color:var(--muted)}
.col.q h2{font-family:var(--f-display);font-weight:600;font-size:20px;line-height:1.2;margin:0}
.sql{font-family:var(--f-mono);font-size:12.5px;background:var(--soft);border-radius:8px;padding:8px 10px;white-space:pre-wrap;overflow-wrap:anywhere}
.plan{font-family:var(--f-mono);font-size:11px;color:var(--muted);overflow-wrap:anywhere}
.path{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.path button{font-family:var(--f-mono);height:22px;padding:0 7px;font-size:11px;border-color:color-mix(in srgb,var(--c) 60%,transparent);background:color-mix(in srgb,var(--c) 12%,transparent)}
.path button.now{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.path button.later{opacity:.55}
.pagehd{font-weight:500}
.pagehd span{font-weight:400;font-size:11.5px;font-variant-numeric:tabular-nums;color:var(--muted);padding-left:10px}
.rows{max-height:230px;overflow:auto}
.rows table{border-collapse:collapse;width:100%;font-family:var(--f-mono);font-size:11.5px;font-variant-numeric:tabular-nums}
.rows th,.rows td{padding:3px 14px 3px 6px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line)}
.rows th{position:sticky;top:0;background:var(--bg);color:var(--muted);font-weight:400}
.rows tr.mark td{background:var(--mark)}
.why{font-size:12.5px;color:var(--ink-2)}
.qcost{display:flex;flex-direction:column;gap:5px;padding:9px 0;border-top:1px solid var(--line)}
.qcost .l{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px}
.qcost .l span{font-size:11.5px;font-variant-numeric:tabular-nums;color:var(--muted)}
.ticks{display:flex;flex-wrap:wrap;gap:2px}
.ticks i{width:9px;height:9px;border-radius:2px;box-shadow:inset 0 0 0 1px var(--line)}
.ticks i.hit{background:var(--hit);box-shadow:none}.ticks i.miss{background:var(--miss);box-shadow:none}

.foot{max-width:100ch;font-size:12px;color:var(--muted)}
#drop{max-width:520px;margin:18vh auto 0;padding:36px 24px;border:2px dashed var(--line);border-radius:12px;text-align:center;color:var(--ink-2)}
#error{max-width:520px;margin:24px auto;padding:0 20px;color:var(--miss)}
body.dragging #drop,body.dragging .app{outline:2px dashed var(--muted);outline-offset:6px}

@media (max-width:720px){
  .grid{grid-template-columns:minmax(0,1fr);grid-template-rows:none;grid-template-areas:"score" "now" "pool" "disk" "time" "fold"}
  .said{font-size:17px}
  .slist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
  dialog{width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;margin:0;border-radius:0;padding:16px}
  .panel{padding:14px 14px;border-radius:16px}
}
@media (prefers-reduced-motion: reduce){.tile,.place{transition:none}}
</style>
</head>
<body>
<div id="drop" hidden>No run data in this page. Drop a <code>run.json</code> here.</div>
<p id="error" hidden></p>

<div class="app" id="app" hidden>
  <header class="top">
    <div class="name"><h1 id="title"></h1><span id="sub"></span></div>
    <div class="tools"><span class="hint" id="howHint" hidden>New here?</span><button type="button" id="howBtn" aria-haspopup="dialog">How it works</button></div>

<script id="example" type="application/json">__BPSIM_EXAMPLE__</script>
<script id="run" type="application/json">__BPSIM_RUN__</script>
<script>
"use strict";
/* ---------- format, names and small helpers ---------- */
const FORMAT = "bpsim-run",
  VERSION = 5;
const INFO = {
  fifo: {name: "FIFO", how: "oldest load out", textbook: true},
  lru: {name: "LRU", how: "least recent out"},
  clock: {name: "Clock", how: "second chance", textbook: true},
  pg: {name: "PostgreSQL-style", how: "usage counts + scan ring"},
  innodb: {name: "InnoDB-style", how: "midpoint insertion"},
  opt: {name: "Optimal", how: "fewest misses, not always fastest"}
};
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
};
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const nameOf = p => (p === "opt" && state.readsAhead ? "Optimal (no read-ahead)" : INFO[p]?.name || p);
/* ---------- pricing: what one access costs on a given drive ---------- */
/* Time for one access under a storage profile, from what the engine recorded.
   A read request costs a fixed part plus one page. Where the page sits
   relative to the last page read sets the fixed part: the next page or a few
   pages further on cost the near overhead plus the skipped pages passing
   under the head (never more than a jump); a jump costs a full request. A
   page SQLite wrote without reading costs nothing to read. A dirty eviction
   adds a write request. Every profile prices the same events. */
function readMs(e, P) {
  if (e.kind === "hit") return P.hit_ms;
  const near = n => Math.min(P.near_request_ms + n * P.page_ms, P.read_request_ms) + P.page_ms;
  const extra = (e.ahead?.length || 0) * P.page_ms; // pages read ahead ride in the same request
  return (
    extra +
    (e.read === "next"
      ? near(0)
      : e.read === "ahead"
        ? near(e.skipped)
        : e.read === "jump"
          ? P.read_request_ms + P.page_ms
          : 0)
  );
}
const writeMs = P => P.write_request_ms + P.page_ms;
const writeBacks = e => (e.evicted?.dirty ? 1 : 0) + (e.ahead_evicted || []).filter(v => v.dirty).length;
const msOf = (e, P) => readMs(e, P) + writeBacks(e) * writeMs(P);
const costOf = e => msOf(e, state.profile);
function fmtMs(ms) {
  if (ms < 1) {
    const us = ms * 1000;
    return `${us < 10 ? us.toFixed(1) : us.toFixed(0)} µs`;
  }
  if (ms < 1000) return `${ms < 10 ? ms.toFixed(2) : ms.toFixed(1)} ms`;
  return `${(ms / 1000).toFixed(2)} s`;
}

/* everything about the loaded run; replaced when a run.json is dropped */
/* ---------- state ---------- */
/* The loaded run: replaced whole when a run.json is dropped on the page. */
const state = {
  data: null, // the run file
  byPolicy: {}, // policy -> its run (events and summary)
  events: [], // the first run's events: every pool sees the same accesses
  accesses: 0, // how many accesses
  frames: 0, // pool size
  pages: {}, // page number -> its description from the trace
  objectColor: {}, // table or index -> its colour
  head: {}, // policy -> page under the read head after each access
  running: {}, // policy -> running totals per access (time, hits, read-ahead hits, requests)
  shape: {}, // policy -> the kind of frame state it draws (clock, pg, innodb, ...)
  lanes: {}, // policy -> its lane's DOM nodes, for the pools drawn
  rows: {}, // policy -> its row in the score column
  lanePos: {}, // policy -> the access its lane last showed
  moments: [], // moments worth a look, in access order
  storage: null, // "ssd" or "hdd": the profile prices are shown in
  profile: null, // that profile's prices
  readsAhead: false // whether any pool reads ahead
};
/* What is on screen. */
const view = {
  pools: [], // the pools drawn: the open one, or all
  focus: null, // the pool opened in its own shape; the timeline and disk follow it
  drawn: new Set(), // pools drawn beside the open one, toggled in the score column
  walk: 0, // the walkthrough's step
  mode: "step", // "step" or "race"
  at: -1, // the access shown; -1 before the first
  playing: false,
  raceId: 0, // bumped to cancel a running race or step animation
  diskCells: {} // page -> its cell in the disk strip
};

const speed = () => +$("speed").value;
const sleep = ms => new Promise(r => setTimeout(r, ms * speed()));

/* ---------- pages and objects: names, colours, descriptions ---------- */
const colorOf = page =>
  state.pages[page] && state.pages[page].object == null
    ? "var(--free)"
    : state.objectColor[state.pages[page]?.object] || "var(--o-schema)";
const objLabel = o => (o === "sqlite_schema" ? "schema" : o || "free");
const pageDesc = page =>
  !state.pages[page]
    ? page === 1
      ? "header"
      : "not described"
    : state.pages[page].object == null
      ? "free page"
      : `${objLabel(state.pages[page].object)} ${kindLabel(page)}`;
const kindLabel = page =>
  page === 1
    ? "header"
    : state.pages[page]?.kind === "internal"
      ? "interior"
      : state.pages[page]?.kind || "page";
const isScanQ = q => state.events.slice(q.accesses[0], q.accesses[1]).some(e => e.scan);

/* ---------- starting a run: checks, running totals, page model ---------- */
function start(data) {
  if (data.format !== FORMAT || data.version !== VERSION)
    throw new Error(`expected ${FORMAT} v${VERSION}, got ${data.format} v${data.version}`);
  if (!data.runs?.length || !data.runs[0].events.length) throw new Error("the run file has no events");
  stopRace();
  view.playing = false;
  Object.assign(state, prepare(data));
  state.lanes = {};
  state.lanePos = {};
  setStorage(state.data.storage, false);

  const shown = comparePools();
  view.focus = ["pg", "innodb"].find(p => shown.includes(p)) || shown[0];
  view.drawn = new Set();
  view.mode = "step";
  view.at = -1;

  $("drop").hidden = true;
  $("error").hidden = true;
  $("app").hidden = false;
  $("title").textContent = `${state.data.scenario}.db`;
  const cap = Math.max(...state.data.runs.map(r => r.summary.read_ahead_cap));
  $("sub").textContent =
    `${state.data.queries.length} quer${state.data.queries.length === 1 ? "y" : "ies"} · ${state.accesses} page accesses · ${state.frames} frame${state.frames === 1 ? "" : "s"} · ` +
    (cap ? `read-ahead up to ${cap} page${cap > 1 ? "s" : ""}` : "no read-ahead");
  $("scrub").max = state.accesses - 1;
  const bad = state.data.runs.filter(r => !addsUp(r)).map(r => nameOf(r.policy));
  $("warn").hidden = !bad.length;
  $("warn").textContent = bad.length
    ? `This run file does not add up for ${bad.join(", ")}: its events and its summary disagree, so the numbers below may be wrong.`
    : "";

  buildDisk();
  buildScore();
  buildHelp();
  buildLanes();
  buildMoments();
  buildTimeline();
  setModeUI();
  $("howHint").hidden = seenHow();
  jump(state.moments.length && state.moments[0].k > 0 ? state.moments[0].k - 1 : -1);
}
/* Everything derived from a run file that drawing and wording read. The
   walkthrough prepares its example the same way. */
function prepare(data) {
  const out = {
    data,
    frames: data.frames,
    events: data.runs[0].events,
    accesses: data.runs[0].events.length,
    byPolicy: {},
    head: {},
    shape: {},
    readsAhead: data.runs.some(r => r.summary.read_ahead_cap > 0),
    pages: {},
    objectColor: {sqlite_schema: "var(--o-schema)"}
  };
  for (const r of data.runs) {
    out.byPolicy[r.policy] = r;
    out.head[r.policy] = heads(r.events);
    out.shape[r.policy] = r.events[0].frames[r.events[0].frame].state.kind;
  }
  for (const p of data.pages) out.pages[p.page] = p;
  data.objects.forEach((o, i) => {
    out.objectColor[o.name] = `var(--o${i % 6})`;
  });
  return out;
}

/* each event list must recount to its own summary, priced as the summary was */
function addsUp(run) {
  const P = state.data.profiles[run.summary.storage];
  let hits = 0,
    nextReads = 0,
    aheadReads = 0,
    jumpReads = 0,
    fresh = 0,
    dirty = 0,
    ms = 0,
    early = 0,
    earlyHits = 0;
  for (const e of run.events) {
    if (e.kind === "hit") hits++;
    else if (e.read === "next") nextReads++;
    else if (e.read === "ahead") aheadReads++;
    else if (e.read === "jump") jumpReads++;
    else fresh++;
    dirty += writeBacks(e);
    ms += msOf(e, P);
    early += e.ahead?.length || 0;
    if (e.read_ahead_hit) earlyHits++;
  }
  const s = run.summary;
  return (
    P &&
    hits === s.hits &&
    nextReads === s.next_page_reads &&
    aheadReads === s.ahead_reads &&
    jumpReads === s.jump_reads &&
    fresh === s.fresh_pages &&
    dirty === s.dirty_evictions &&
    early === s.pages_read_ahead &&
    earlyHits === s.read_ahead_hits &&
    nextReads + aheadReads + jumpReads === s.read_requests &&
    Math.abs(ms - s.total_ms) < 1e-9 * Math.max(1, s.total_ms)
  );
}

/* switching storage reprices the same events; nothing cached changes */
function setStorage(kind, redraw = true) {
  if (!state.data.profiles[kind]) return;
  state.storage = kind;
  state.profile = state.data.profiles[kind];
  state.running = {};
  for (const r of state.data.runs) {
    let ms = 0,
      hits = 0,
      early = 0,
      req = 0;
    const c = [],
      h = [],
      a = [],
      q = [];
    for (const e of r.events) {
      ms += costOf(e);
      if (e.kind === "hit") hits++;
      if (e.read_ahead_hit) early++;
      if (e.read) req++;
      c.push(ms);
      h.push(hits);
      a.push(early);
      q.push(req);
    }
    state.running[r.policy] = {c, h, a, q};
  }
  $("sSsd").setAttribute("aria-pressed", kind === "ssd");
  $("sHdd").setAttribute("aria-pressed", kind === "hdd");
  if (redraw) {
    buildHelp();
    buildMoments();
    buildTimeline();
    renderAll(view.at);
  }
}

/* ---------- database file strip, help ---------- */

function buildDisk() {
  const cells = $("cells");
  cells.replaceChildren();
  view.diskCells = {};
  const cols = Math.min(state.data.page_count, state.data.page_count > 400 ? 100 : 80);
  cells.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;
  cells.classList.toggle("dense", state.data.page_count > 4 * cols);
  for (let p = 1; p <= state.data.page_count; p++) {
    const c = el("i");
    c.style.setProperty("--c", colorOf(p));
    if (state.pages[p]?.kind === "internal" || p === 1) c.className = "int";
    c.title = `page ${p} · ${pageDesc(p)}`;
    cells.append(c);
    view.diskCells[p] = c;
  }
  const legend = $("legend");
  legend.replaceChildren(el("span", "", `${state.data.scenario}.db on disk, ${state.data.page_count} pages`));
  for (const o of ["sqlite_schema", ...state.data.objects.map(o => o.name)]) {
    const s = el("span");
    const sw = el("i");
    s.style.setProperty("--c", state.objectColor[o]);
    s.append(sw, objLabel(o));
    legend.append(s);
  }
  if (state.data.pages.some(p => p.object == null)) {
    const s = el("span");
    const sw = el("i");
    s.style.setProperty("--c", "var(--free)");
    s.append(sw, "free (on the freelist)");
    legend.append(s);
  }
  const m = el("span");
  const dot = el("i");
  dot.style.cssText = "background:var(--accent);border-radius:50%";
  m.append(dot, "modified in memory");
  legend.append(m);
}
function buildHelp() {
  const key = $("key");
  key.replaceChildren();
  const item = (cls, text) => {
    const sp = el("span");
    sp.append(el("i", cls), text);
    key.append(sp);
  };
  item("kh", "hit");
  if (state.readsAhead) item("ka", "hit on a page read ahead");
  item("kx", "miss: read from disk");
  item("km", "a moment worth a look");

  const help = $("help");
  help.replaceChildren();
  const tip = (lead, text) => {
    const p = el("p");
    p.append(el("b", "", lead + " "), text);
    help.append(p);
  };
  tip(
    "Pools.",
    `Each pool serves the same ${state.accesses} page requests with ${state.frames} frame${state.frames === 1 ? "" : "s"} of memory. They differ only in what they evict. The score column shows each one's hits so far: click a pool to open it, or its dot to draw it beside the open one. Show all pools draws every one.`
  );
  tip(
    "Timeline.",
    "One cell per page request, for the open pool, grouped by query. Runs of misses are the pool waiting on the disk; a scan shows as a long stretch of them. Cells not reached yet are faded."
  );
  tip(
    "Moving.",
    "Drag on the timeline, or use the left and right arrow keys, to move through the requests. Click a query name or a diamond to jump."
  );
  tip(
    "Disk.",
    "The database file in page order, coloured by table. The open pool's current page is outlined; the triangle marks the last page it read, which is where the next read starts from."
  );
  const P = state.profile;
  tip(
    "Time.",
    state.storage === "hdd"
      ? `Rough time on a hard drive: ${fmtMs(P.hit_ms)} for a hit. A read after a jump (backwards, or the first) is a seek and half a turn of the platter: ${fmtMs(P.read_request_ms + P.page_ms)}. Reading further on is cheap, since the head is already moving that way: ${fmtMs(P.near_request_ms + P.page_ms)} for the next page plus ${fmtMs(P.page_ms)} for each page skipped (${fmtMs(P.near_request_ms)} of that is an assumed overhead). Writing a modified page back is a separate ${fmtMs(writeMs(P))}. Switch SSD and HDD at the top; what is cached stays the same.`
      : `Rough time on an SSD: ${fmtMs(P.hit_ms)} for a hit, ${fmtMs(P.read_request_ms + P.page_ms)} for any read, wherever the page is (there is no head to move; some drives prefetch the next pages themselves, which is left out), and ${fmtMs(writeMs(P))} to write a modified page back (the drive's cache takes it). So on an SSD, layout only matters once pages are read in fewer, larger requests. Switch SSD and HDD at the top; what is cached stays the same.`
  );
  tip(
    "Race.",
    "With two or more pools drawn, Race replays them at the pace of its time, on a squashed scale so hits stay visible next to slow reads. Optimal has the fewest misses, but not always the least time: it ignores what a miss costs."
  );
  if (state.readsAhead)
    tip(
      "Read-ahead.",
      'When a miss continues a table or index (its previous access was the page before), the pool also reads the next few pages of that table in the same request, up to a quarter of the pool. PostgreSQL-style reads ahead for scans instead, and only as far as its scan ring allows. Read-ahead pages enter cold: Clock leaves their bit clear, InnoDB-style puts them at the head of old and starts their clock at first use. Hits on them show as "read ahead". Requests count how often a query waited on the disk. Optimal never reads ahead, so others can beat its misses.'
    );
  const mini = [];
  if (state.byPolicy.pg)
    mini.push("the PostgreSQL-style scan ring is a quarter of the pool (real: 32 pages)");
  if (state.byPolicy.innodb)
    mini.push("InnoDB-style promotes a page on a hit in a later query (real: after 1 second)");
  help.append(
    el(
      "p",
      "foot",
      `Page reads were captured from SQLite ${state.data.sqlite_version} and replayed through miniature policies` +
        (mini.length ? `: ${mini.join("; ")}` : "") +
        ". Every pool sees SQLite's reads; another database would read different pages for the same query. Times come from one datasheet per drive (a Samsung 990 Pro SSD, a 7,200 rpm enterprise hard drive); the operating system's file cache and overlapping I/O with work are left out. Requests are timed one after another; a real SSD serves several at once, so its gain from fewer, larger requests is if anything larger than shown. The layout is SQLite's: tables share one file page by page." +
        (state.readsAhead
          ? " Read-ahead here is a simple rule (two pages of a table in a row; scans for PostgreSQL-style); real InnoDB reads a whole 64-page extent once 56 of its pages were read in order, and would not read ahead tables this small at all."
          : "")
    )
  );
}

/* ---------- score column, pools on screen, timeline ---------- */
const allPools = () => state.data.runs.map(r => r.policy);
/* the pools moments compare: the real-world ones, unless only textbook ones ran */
const comparePools = () => {
  const real = allPools().filter(p => !INFO[p]?.textbook);
  return real.length ? real : allPools();
};
function buildScore() {
  const list = $("slist");
  list.replaceChildren();
  state.rows = {};
  for (const p of allPools()) {
    const line = el("div", "srow"),
      open = el("button", "sopen"),
      draw = el("button", "sdraw");
    line.dataset.p = p;
    open.type = draw.type = "button";
    open.append(el("span", "n", nameOf(p)), el("span", "h"), el("span", "d"));
    open.addEventListener("click", () => setFocus(p));
    draw.addEventListener("click", () => toggleDrawn(p));
    line.append(open, draw, el("span", "place"));
    list.append(line);
    state.rows[p] = line;
  }
  $("scoreHead").textContent = `Hits of ${state.accesses}`;
  $("snote").textContent = "Click a pool to open it. The dot draws it beside the open one.";
}
function paintScore(at) {
  for (const p of allPools()) {
    const b = state.rows[p],
      t = totals(p, at),
      left = at === state.accesses - 1 ? state.byPolicy[p].summary.dirty_at_end : 0;
    const open = p === view.focus,
      draw = b.querySelector(".sdraw");
    b.classList.toggle("on", open);
    b.querySelector(".sopen").setAttribute("aria-pressed", open);
    draw.setAttribute("aria-pressed", open || view.drawn.has(p));
    draw.setAttribute("aria-disabled", open);
    draw.setAttribute("aria-label", open ? `${nameOf(p)} is open` : `Draw ${nameOf(p)} beside the open pool`);
    draw.title = open
      ? "Open"
      : view.drawn.has(p)
        ? "Drawn beside the open pool"
        : "Draw beside the open pool";
    b.querySelector(".h").textContent = at < 0 ? "–" : t.hits;
    b.querySelector(".d").textContent =
      at < 0 ? INFO[p]?.how || "" : `${fmtMs(t.cost)} · ${t.req} request${t.req === 1 ? "" : "s"}`;
    b.querySelector(".sopen").title =
      at < 0
        ? ""
        : [
            `${t.hits} hits of ${at + 1}, ${t.early} of them on pages read ahead; ${t.req} disk request${t.req === 1 ? "" : "s"} waited on`,
            left
              ? `${left} modified page${left > 1 ? "s" : ""} still in memory at the end; a checkpoint would write ${left > 1 ? "them" : "it"} (not counted)`
              : ""
          ]
            .filter(Boolean)
            .join(". ");
  }
}

/* the pools drawn: the open one, or all of them */
function buildLanes() {
  stopRace();
  view.pools = allPools().filter(p => p === view.focus || view.drawn.has(p));
  const pools = $("pools");
  pools.replaceChildren();
  state.lanes = {};
  for (const p of view.pools) {
    const lane = el("section", "pool");
    lane.setAttribute("aria-label", nameOf(p));
    const pn = el("button", "pname");
    pn.type = "button";
    pn.append(el("span", "", nameOf(p)), el("small", "", INFO[p]?.how || ""));
    pn.addEventListener("click", () => setFocus(p));
    const fig = el("div", "fig"),
      sayEl = el("div", "say");
    lane.append(pn, fig, sayEl);
    pools.append(lane);
    state.lanes[p] = {lane, pn, fig, sayEl};
    state.lanePos[p] = view.at;
  }
  for (const p of view.pools) state.lanes[p].lane.classList.toggle("focus", p === view.focus);
  $("allBtn").setAttribute("aria-pressed", view.pools.length === allPools().length);
  /* Race needs two pools drawn */

      for (let i = 0; i < state.accesses; i++) {
        const e = ev[i];
        if (e.kind === "miss" && last[e.page] !== undefined && state.byPolicy.opt.events[i].kind === "hit") {
          (regrets[i] ||= {k: i, page: e.page, who: []}).who.push(nameOf(p));
          break;
        }
        if (e.evicted) last[e.evicted.page] = i;
      }
    }
    for (const r of Object.values(regrets))
      list.push({
        k: r.k,
        t: "Paying for an eviction",
        d: `${and(r.who)} evicted p${r.page} earlier and must now read it back from disk. Optimal kept it.`
      });
  }
  for (const p of real) {
    const i = E(p).findIndex(e => e.evicted?.dirty);
    if (i >= 0) {
      list.push({
        k: i,
        t: "A modified page goes back to disk",
        d: `${nameOf(p)} writes p${E(p)[i].evicted.page} back before reusing the frame, so this access takes ${fmtMs(writeMs(state.profile))} longer.`
      });
      break;
    }
  }
  if (real.length > 1) {
    let best = null;
    state.data.queries.forEach((q, i) => {
      const h = real.map(
          p =>
            E(p)
              .slice(q.accesses[0], q.accesses[1])
              .filter(e => e.kind === "hit").length
        ),
        gap = Math.max(...h) - Math.min(...h);
      if (gap > 0 && (!best || gap > best.gap)) best = {gap, i, h};
    });
    if (best) {
      const q = state.data.queries[best.i],
        n = q.accesses[1] - q.accesses[0];
      list.push({
        k: q.accesses[0],
        t: "Same query, different hits",
        d: real.map((p, j) => `${nameOf(p)} ${best.h[j]}/${n} hits`).join(" · ")
      });
    }
  }
  state.moments = list.sort((a, b) => a.k - b.k);
}
function renderMoment(at) {
  const box = $("moment");
  box.replaceChildren();
  if (view.mode === "race") {
    box.append(
      el(
        "span",
        "d",
        "Each pool runs at its own pace: hits are quick, disk reads take visible time, write-backs longer."
      )
    );
    return;
  }
  const here = state.moments.filter(m => m.k === at),
    next = state.moments.find(m => m.k > at);
  if (here.length)
    box.append(
      el("span", "tag", "◆ " + here.map(m => m.t).join(" · ")),
      el("span", "d", here.map(m => m.d).join(" "))
    );
  else box.append(el("span", "d", at < 0 && next ? "Press Play, or jump to the first moment." : ""));
  if (next) {
    const b = el("button", "", `next: ${next.t.toLowerCase()} →`);
    b.type = "button";
    b.addEventListener("click", () => {
      stopPlaying();
      jump(next.k);
    });
    box.append(b);
  }
}

/* ---------- the query's path, rows and cost ---------- */
function renderFold(at) {
  const sum = $("foldSum"),
    body = $("foldBody");
  sum.replaceChildren();
  body.replaceChildren();
  if (at < 0 || view.mode === "race") {
    sum.append(el("b", "", "Query path and rows"), "shown while stepping");
    return;
  }
  const e = state.events[at],
    q = state.data.queries[e.query],
    rows = state.data.rows[e.page],
    [a, b] = q.accesses;
  sum.append(
    el("b", "", "Query path and rows"),
    `p${e.page} · ${pageDesc(e.page)}` + (rows ? ` · ${rows.rows.length} entries` : "")
  );
  if (!$("fold").open) return;

  const cq = el("div", "col q");
  cq.append(
    el("span", "eyebrow", `the query · ${e.query + 1} of ${state.data.queries.length}`),
    el("h2", "", q.title),
    el("div", "sql", q.sql)
  );
  if (q.plan.length) cq.append(el("div", "plan", "plan: " + q.plan.join(" · ")));
  cq.append(el("div", "why", `${b - a} page read${b - a === 1 ? "" : "s"}.`));

  const cp = el("div", "col p"),
    path = el("div", "path");
  const lo = Math.max(a, Math.min(at - 6, b - 14)),
    hi = Math.min(b, Math.max(lo + 14, at + 2));
  if (lo > a) path.append("…");
  for (let i = lo; i < hi; i++) {
    const x = el("button", i === at ? "now" : i > at ? "later" : "", "p" + state.events[i].page);
    x.type = "button";
    x.style.setProperty("--c", colorOf(state.events[i].page));
    x.title = `read ${i + 1}: ${pageDesc(state.events[i].page)}`;
    x.addEventListener("click", () => {
      stopPlaying();
      jump(i);
    });
    path.append(x);
    if (i < hi - 1) path.append("→");
  }
  if (hi < b) path.append("…");
  const hd = el("div", "pagehd", pageDesc(e.page));
  if (rows) hd.append(el("span", "", `${rows.rows.length} entries on p${e.page}`));
  cp.append(el("span", "eyebrow", "the pages it reads"), path, hd);
  if (!rows)
    cp.append(
      el(
        "div",
        "why",
        e.page === 1
          ? "Page 1 holds the file header and schema. SQLite reads it at the start of every statement."
          : "No rows were captured for this page."
      )
    );
  else {
    const ci = c => rows.columns.indexOf(c),
      next = at + 1 < b ? state.events[at + 1].page : null;
    const w = q.sql.split(/\bWHERE\b/i)[1],
      lits = w
        ? [...w.matchAll(/(\w+)\s*=\s*(?:'([^']*)'|(\d+(?:\.\d+)?))/g)].map(m => ({
            col: m[1],
            val: m[2] ?? m[3]
          }))
        : [];
    let reason = "";
    const marked = rows.rows.map(r => {
      if (ci("child_page") >= 0) {
        if (next != null && r[ci("child_page")] === next) {
          reason = `Highlighted: the entry SQLite follows down to p${next}.`;
          return true;
        }
        return false;
      }
      const hitLits = lits.filter(l => ci(l.col) >= 0 && String(r[ci(l.col)]) === l.val);
      if (hitLits.length) {
        reason = `Highlighted: ${hitLits.map(l => `${l.col} = ${l.val}`).join(", ")}.`;
        return true;
      }
      return false;
    });
    if (!reason && e.scan) reason = "The scan reads every entry on this page.";
    const wrap = el("div", "rows"),
      table = el("table"),
      head = el("tr");
    rows.columns.forEach(c => head.append(el("th", "", c)));
    table.append(head);
    let first = null;
    rows.rows.forEach((r, i) => {
      const tr = el("tr", marked[i] ? "mark" : "");
      if (marked[i]) first ||= tr;
      r.forEach(v => tr.append(el("td", "", v ?? "–")));
      table.append(tr);
    });
    wrap.append(table);
    cp.append(wrap);
    if (reason) cp.append(el("div", "why", reason));
    if (first)
      requestAnimationFrame(() => {
        wrap.scrollTop = Math.max(0, first.offsetTop - 60);
      });
  }

  const cc = el("div", "col c");
  cc.append(el("span", "eyebrow", "this query in each pool, so far"));
  const list = el("div");
  for (const p of allPools()) {
    const evs = state.byPolicy[p].events,
      row = el("div", "qcost"),
      l = el("div", "l"),
      ticks = el("div", "ticks");
    let cost = 0,
      hits = 0;
    for (let i = a; i < b; i++) {
      const done = i <= at;
      if (done) {
        cost += costOf(evs[i]);
        if (evs[i].kind === "hit") hits++;
      }
      ticks.append(el("i", done ? evs[i].kind : ""));
    }
    l.append(nameOf(p), el("span", "", `${hits}/${at - a + 1} hits · ${fmtMs(cost)}`));
    row.append(l, ticks);
    list.append(row);
  }
  cc.append(list);
  body.append(cq, cp, cc);
}

/* ---------- motion ---------- */
function centerIn(node) {
  const a = node.getBoundingClientRect(),
    b = $("app").getBoundingClientRect();
  return {x: a.left - b.left + a.width / 2, y: a.top - b.top + a.height / 2};
}
async function fly(from, to, label, c, wb, ms) {
  if (reduce || !from || !to) return;
  const t = el("div", "fly" + (wb ? " wb" : ""), label);
  t.style.setProperty("--c", c);
  $("app").append(t);
  const A = centerIn(from),
    B = centerIn(to);
  const a = t.animate(
    [
      {transform: `translate(${A.x - 14}px,${A.y - 14}px) scale(.7)`, opacity: 0.2},
      {
        transform: `translate(${(A.x + B.x) / 2 - 14}px,${Math.min(A.y, B.y) - 26}px)`,
        opacity: 1,
        offset: 0.5
      },
      {transform: `translate(${B.x - 14}px,${B.y - 14}px)`, opacity: 1}
    ],
    {duration: ms * speed(), easing: "cubic-bezier(.3,.7,.3,1)"}
  );
  await a.finished.catch(() => {});
  t.remove();
}
const tileOf = (p, page) => state.lanes[p]?.fig.querySelector(`[data-page="${page}"]`);
/* `id` is the epoch the step belongs to; a jump or a newer step makes it
   stale. A page flies in from the disk only when stepping one at a time, and
   only into the open pool; otherwise the open pool's frame fills or rings in
   place and other pools change quietly. */
async function animateStep(p, at, id, manual = false) {
  const e = state.byPolicy[p].events[at];
  if (!state.lanes[p]) return;
  const open = p === view.focus;
  if (e.kind === "hit" || !manual || !open || reduce) {
    paintLane(p, at);
    if (reduce || !open) return;
    const t = tileOf(p, e.page),
      cls = e.kind === "hit" ? "pulse" : "arrive";
    t?.classList.add(cls);
    await sleep(view.mode === "race" ? 0 : e.kind === "hit" ? 160 : 260);
    setTimeout(() => t?.classList.remove(cls), 340);
    return;
  }
  if (e.evicted?.dirty) {
    const from = tileOf(p, e.evicted.page);
    if (from)
      await fly(
        from,
        view.diskCells[e.evicted.page],
        "p" + e.evicted.page,
        colorOf(e.evicted.page),
        true,
        360
      );
    else await sleep(360);
  }
  if (id !== view.raceId || !state.lanes[p]) return;
  paintLane(p, at);
  const t = tileOf(p, e.page);
  if (t) {
    t.style.visibility = "hidden";
    await fly(view.diskCells[e.page], t, "p" + e.page, colorOf(e.page), false, 400);
    t.style.visibility = "";
  } else await sleep(400);
}

/* ---------- how it works: a worked example, then how to read the page ---------- */
/* The example is a tiny run the engine made when it wrote this page. */
const EXAMPLE = (() => {
  try {
    const d = JSON.parse($("example").textContent);
    return d.format === FORMAT && d.version === VERSION && d.runs?.[0]?.events.length ? d : null;
  } catch {
    return null;
  }
})();
const EX = EXAMPLE && prepare(EXAMPLE);
/* Draw and word with the example's data in place of the run's, then put the
   run's back: the same code explains both. */
function borrow(fields, fn) {
  const old = {};
  for (const k of Object.keys(fields)) {
    old[k] = state[k];
    state[k] = fields[k];
  }
  try {
    return fn();
  } finally {
    Object.assign(state, old);
  }
}
function renderWalk() {
  const run = EXAMPLE.runs[0],
    p = run.policy,
    n = run.events.length,
    i = view.walk,
    e = run.events[i],
    q = EXAMPLE.queries[e.query];
  $("walkSub").textContent =
    `A tiny database replayed by this engine: ${EX.frames} frames, ${nameOf(p)} (${INFO[p]?.how}), read-ahead on.`;
  $("walkQ").textContent = `${e.query + 1}. ${q.title}`;
  $("walkSql").textContent = q.sql;
  borrow({...EX, lanes: {[p]: {fig: $("walkFig")}}, profile: state.profile}, () => {
    $("walkFig").replaceChildren(drawFocus(p, e, i, e.frame));
    const said = $("walkSaid");
    said.replaceChildren();
    for (const part of opening(e))
      said.append(typeof part === "string" ? part : el("span", part[0], part[1]));
    said.append(el("span", "", ` · ${pageDesc(e.page)}`));
    said.lastChild.style.cssText = "color:var(--muted);font-size:.7em";
    $("walkWhy").textContent = describe(p, e);
  });
  const upTo = run.events.slice(0, i + 1),
    hits = upTo.filter(x => x.kind === "hit").length,
    misses = upTo.length - hits;
  $("walkTally").textContent =
    `${i + 1} of ${n} · ${hits} hit${hits === 1 ? "" : "s"}, ${misses} miss${misses === 1 ? "" : "es"}`;
  $("walkDots").replaceChildren(...run.events.map((_, k) => el("i", k === i ? "on" : "")));
  $("walkBack").disabled = i === 0;
  $("walkNext").textContent = i === n - 1 ? "Start over" : "Next";
}
function walkBy(d) {
  const n = EXAMPLE.runs[0].events.length;
  view.walk = d > 0 && view.walk === n - 1 ? 0 : Math.max(0, Math.min(n - 1, view.walk + d));
  renderWalk();
}
const seenHow = () => {
  try {
    return localStorage.getItem("bpsim.seenHow") === "1";
  } catch {
    return false;
  }
};
function openHow() {
  stopPlaying();
  $("walk").hidden = !EXAMPLE;
  if (EXAMPLE) renderWalk();
  $("how").showModal();
  $("howHint").hidden = true;
  try {
    localStorage.setItem("bpsim.seenHow", "1");
  } catch {
    /* the hint just shows again next time */
  }
}
$("howBtn").addEventListener("click", openHow);
$("howClose").addEventListener("click", () => $("how").close());
$("how").addEventListener("click", ev => {
  if (ev.target === $("how")) $("how").close(); // a click on the backdrop
});
$("how").addEventListener("close", () => $("howBtn").focus());
$("walkBack").addEventListener("click", () => walkBy(-1));
$("walkNext").addEventListener("click", () => walkBy(1));

/* ---------- controls ---------- */
function setModeUI() {
  $("mStep").setAttribute("aria-pressed", view.mode === "step");
  $("mRace").setAttribute("aria-pressed", view.mode === "race");
  $("prev").disabled = $("next").disabled = view.mode === "race";
  $("play").textContent = view.mode === "race" ? "Race" : "Play";
}
function clearPlaces() {
  for (const b of Object.values(state.rows)) b.querySelector(".place").classList.remove("on");
}
function setMode(m) {
  if (m === view.mode) return;
  stopRace();
  stopPlaying();
  view.mode = m;
  if (m === "race") view.at = -1;
  setModeUI();
  clearPlaces();
  renderAll(view.at);
}
function toStep() {
  if (view.mode !== "step") setMode("step");
  stopPlaying();
}
function jump(i) {
  stopRace();
  view.at = Math.max(-1, Math.min(state.accesses - 1, i));
  clearPlaces();
  renderAll(view.at);
}
async function stepForward(manual = false) {
  if (view.at >= state.accesses - 1) return false;
  for (const p of view.pools) if (state.lanePos[p] !== view.at) paintLane(p, view.at);
  view.at++;
  const at = view.at,
    id = ++view.raceId;
  document.querySelectorAll(".fly").forEach(f => f.remove());
  renderChrome(at);
  await Promise.all(view.pools.map(p => animateStep(p, at, id, manual)));
  return id === view.raceId;
}
function stopPlaying() {
  view.playing = false;
  if (view.mode === "step") $("play").textContent = "Play";
}
async function play() {
  view.playing = true;
  $("play").textContent = "Pause";
  if (view.at >= state.accesses - 1) jump(-1);
  while (view.playing && (await stepForward()))
    await sleep(state.moments.some(m => m.k === view.at) ? 1400 : 280);
  stopPlaying();
}
function stopRace() {
  view.raceId++;
  if (view.mode === "race") {
    view.playing = false;
    $("play").textContent = "Race";
  }
  document.querySelectorAll(".fly").forEach(f => f.remove());
}
async function race() {
  stopRace();
  const id = view.raceId;
  view.playing = true;
  $("play").textContent = "Stop";
  view.at = -1;
  clearPlaces();
  renderAll(-1);
  let place = 0;
  await Promise.all(
    view.pools.map(async p => {
      for (let i = 0; i < state.accesses; i++) {
        if (id !== view.raceId) return;
        await animateStep(p, i, id);
        if (id !== view.raceId) return;
        await sleep(30 + 60 * Math.log10(1 + costOf(state.byPolicy[p].events[i]) / state.profile.hit_ms));
      }
      if (id !== view.raceId) return;
      place++;
      const pl = state.rows[p].querySelector(".place");
      pl.textContent = ["1st", "2nd", "3rd"][place - 1] || place + "th";
      pl.classList.add("on");
    })
  );
  if (id === view.raceId) {
    view.playing = false;
    $("play").textContent = "Race again";
  }
}
$("play").addEventListener("click", () =>
  view.mode === "race" ? (view.playing ? stopRace() : race()) : view.playing ? stopPlaying() : play()
);
$("mStep").addEventListener("click", () => setMode("step"));
$("sSsd").addEventListener("click", () => {
  stopRace();
  setStorage("ssd");
});
$("sHdd").addEventListener("click", () => {
  stopRace();
  setStorage("hdd");
});
$("mRace").addEventListener("click", () => setMode("race"));
$("allBtn").addEventListener("click", toggleAll);
$("prev").addEventListener("click", () => {
  stopPlaying();
  jump(view.at - 1);
});
$("next").addEventListener("click", () => {
  stopPlaying();
  stepForward(true);
});
$("scrub").addEventListener("input", () => {
  toStep();
  jump(+$("scrub").value);
});
$("fold").addEventListener("toggle", () => {
  if (state.data) renderFold(view.at);
});
document.addEventListener("keydown", e => {
  if ($("how").open) {
    if (EXAMPLE && (e.key === "ArrowRight" || e.key === "ArrowLeft")) {
      e.preventDefault();
      walkBy(e.key === "ArrowRight" ? 1 : -1);
    }
    return;
  }
  if (!state.data || view.mode !== "step" || e.target.closest("input,select,summary")) return;
  if (e.key === "ArrowRight") {
    e.preventDefault();
    stopPlaying();
    stepForward(true);
  }
  if (e.key === "ArrowLeft") {
    e.preventDefault();
    stopPlaying();
    jump(view.at - 1);
  }
});

/* drag on the timeline to move through the run */
let dragging = false;
const scrubTo = ev => {
  const r = $("tlCanvas").getBoundingClientRect();
  jump(Math.floor(((ev.clientX - r.left) / r.width) * state.accesses));
};
$("tlWrap").addEventListener("pointerdown", ev => {
  if (ev.target.closest("button") || ev.button) return;
  toStep();
  dragging = true;
  $("tlWrap").setPointerCapture(ev.pointerId);
  scrubTo(ev);
});
$("tlWrap").addEventListener("pointermove", ev => {
  if (dragging) scrubTo(ev);
});
for (const type of ["pointerup", "pointercancel"])
  $("tlWrap").addEventListener(type, () => {
    dragging = false;
  });
let resizeTimer = 0;
addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if (state.data) {
      buildTimeline();
      markTimeline(view.at);
    }
  }, 150);
});
/* the strip is drawn in the page's colours, which change with the theme */
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
  if (state.data) drawTimeline();
});

/* ---------- loading ---------- */
function fail(err) {
  const p = $("error");
  p.textContent = `Could not show this run: ${err.message}`;
  p.hidden = false;
}
function load(text) {
  try {
    start(JSON.parse(text));
  } catch (err) {
    fail(err);
  }
}
const embedded = $("run").textContent.trim();
if (embedded === "__BPSIM" + "_RUN__") $("drop").hidden = false;
else load(embedded);
document.addEventListener("dragover", e => {
  e.preventDefault();
  document.body.classList.add("dragging");
});
document.addEventListener("dragleave", () => document.body.classList.remove("dragging"));
document.addEventListener("drop", async e => {
  e.preventDefault();
  document.body.classList.remove("dragging");
  const file = e.dataTransfer.files[0];
  if (file) load(await file.text());
});

/* ---------- for automated checks (verify/browser.py) ---------- */
/* A small read-only window on the page, so checks do not depend on the
   names of its internals. */
window.bpsim = Object.freeze({
  version: VERSION,
  accesses: () => state.accesses,
  at: () => view.at,
  playing: () => view.playing,
  running: policy => state.running[policy],
  focus: () => view.focus,
  kinds: policy => state.byPolicy[policy].events.map(e => (e.kind === "miss" && !e.read ? "fresh" : e.kind)),
  jump
});
</script>
