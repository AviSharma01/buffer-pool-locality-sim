[package]
name = "sim"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"

# The engine is a library (no file I/O, no clocks) so the CLI and a future
# WebAssembly build can share it. The CLI binary is a thin wrapper.
[lib]
name = "bpsim"
path = "src/lib.rs"

[[bin]]
name = "sim"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
toml = "0.8"
chrono = { version = "0.4", features = ["clock"] }
clap = { version = "4", features = ["derive"] }
